[defaults]
inventory = inventory/hosts.ini
# roles shared by the subsystems (run from the repository root)
roles_path = roles
# The boards' and the BMC's host keys are pinned in inventory/known_hosts
# (ssh-keyscan output); a changed key is checked by a person, not accepted.
host_key_checking = True
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 3600
interpreter_python = auto_silent
# Facts only as ansible_facts[...] (the ansible-core 2.24 default).
inject_facts_as_vars = False
forks = 10
timeout = 30

[callback_default]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=inventory/known_hosts -o StrictHostKeyChecking=yes
