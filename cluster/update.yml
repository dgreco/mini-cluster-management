---
# Update every node (or one: -e target=<node>) to the latest packages.
#   make cluster-update                       # full-upgrade, report nodes that need a reboot
#   make cluster-update ARGS="-e reboot=true" # ...then reboot those nodes one at a time,
#                                             # with the subsystem maintenance hooks
- name: Upgrade packages
  hosts: "{{ target | default('nodes') }}"
  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true

    # apt list shows every newer version; apt-get -s shows what the upgrade and
    # autoremove below will really do. The difference is kept back: phased
    # Ubuntu updates not yet offered to this machine, or held packages.
    - name: List upgradable packages
      ansible.builtin.command: apt list --upgradable
      register: upgradable
      changed_when: false
      check_mode: false

    - name: Simulate the upgrade and the clean-up
      ansible.builtin.command: apt-get -s {{ item }}  # noqa: command-instead-of-module (the apt module cannot list a simulated plan)
      loop:
        - dist-upgrade
        - autoremove
      register: apt_simulation
      changed_when: false
      check_mode: false

    - name: Pending changes
      ansible.builtin.debug:
        msg:
          upgrade: "{{ _upgrade | default(['nothing'], true) }}"
          kept back: "{{ _kept_back | default(['nothing'], true) }}"
          remove: "{{ _remove | default(['nothing'], true) }}"
      vars:
        _upgrade: >-
          {{ apt_simulation.results[0].stdout_lines | select('match', 'Inst ')
             | map('regex_replace', '^Inst (\S+) (\[\S+\] )?\((\S+) .*$', '\1 \3') | list }}
        _kept_back: >-
          {{ upgradable.stdout_lines | select('search', '\[upgradable from')
             | map('regex_replace', '/.*$', '')
             | reject('in', _upgrade | map('split', ' ') | map('first') | list) | list }}
        _remove: >-
          {{ (apt_simulation.results[0].stdout_lines + apt_simulation.results[1].stdout_lines)
             | select('match', 'Remv ') | map('regex_replace', '^Remv (\S+).*$', '\1') | unique | list }}

    - name: Full upgrade
      ansible.builtin.apt:
        upgrade: full
        autoclean: true

    # A separate step: --auto-remove on the upgrade only applies to install
    # and remove, so packages left over from earlier upgrades would stay.
    - name: Remove packages no longer needed
      ansible.builtin.apt:
        autoremove: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'REBOOT REQUIRED' if reboot_required.stat.exists else 'no reboot needed' }}
          {{ '(pass -e reboot=true to reboot now)' if reboot_required.stat.exists and not (reboot | default(false) | bool) else '' }}

- name: Nodes to reboot
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Nodes that need a reboot (only with -e reboot=true)
      ansible.builtin.set_fact:
        rolling_candidates: >-
          {{ (_upgraded | zip(_upgraded | map('extract', hostvars, ['reboot_required', 'stat', 'exists']))
              | selectattr('1') | map('first') | list) if reboot | default(false) | bool else [] }}
      vars:
        _upgraded: "{{ query('inventory_hostnames', target | default('nodes')) | select('in', groups['nodes']) | list }}"

# The same safe rolling reboot as cluster/reboot.yml.
- name: Rolling reboot of the nodes that need it
  ansible.builtin.import_playbook: rolling-reboot.yml
