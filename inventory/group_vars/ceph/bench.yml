---
# Ceph subsystem: the benchmarks (make ceph-bench*). See main.yml.

# ---------------------------------------------------------------- benchmarks ----
# make ceph-bench (all three) / ceph-bench-rados / ceph-bench-s3 / ceph-bench-cephfs.
# Load comes from every host in the `bench_hosts` pattern at once (default:
# the ceph nodes; e.g. ARGS="-e bench_hosts=node4:node3"). rados bench needs
# the admin keyring, so it always runs from the ceph_mons. Results are saved
# under bench-results/ on the control node. Nodes have 1 GbE each: a single
# client cannot see more than ~110 MB/s.
ceph_bench_duration: 60                  # seconds per test
ceph_bench_results_dir: "{{ inventory_dir }}/../bench-results"
ceph_bench_rados_pool: bench-rados       # temporary, deleted afterwards
ceph_bench_rados_threads: 16
ceph_bench_rados_block_size: 4194304
ceph_bench_warp_version: "1.3.1"
ceph_bench_s3_uid: bench                 # dedicated S3 user, keys in .secrets/s3-bench.*
ceph_bench_s3_target: rgw                # rgw: every RGW daemon directly (HTTP); ingress: the VIP (HTTPS)
ceph_bench_s3_ops: [put, get, mixed]
ceph_bench_s3_obj_size: 4MiB
ceph_bench_s3_concurrent: 16             # per load host
ceph_bench_s3_objects: 250               # per load host, for get/mixed
ceph_bench_fio_size: 1G                  # per fio job file
ceph_bench_fio_jobs:
  - { name: seq-write-4m, rw: write, bs: 4M, iodepth: 16, numjobs: 1 }
  - { name: seq-read-4m, rw: read, bs: 4M, iodepth: 16, numjobs: 1 }
  - { name: rand-write-4k, rw: randwrite, bs: 4k, iodepth: 32, numjobs: 4 }
  - { name: rand-read-4k, rw: randread, bs: 4k, iodepth: 32, numjobs: 4 }
