# AN EXAMPLE INVENTORY: four boards node1..node4; put yours here, with their
# host keys in inventory/known_hosts (README, setup step 2).
#
# Single inventory shared by every subsystem and by the cluster/ playbooks.
#
# Inventory hostnames MUST be each node's hostname, short or with the cluster
# domain (the boards report <node>.<cluster_domain>). node_ip is the node's LAN
# address (what it reports as default IPv4; preflight checks it): the network
# policies and the scrape targets of the gitops tree are rendered from it.
# Every other setting of the site is in group_vars/all/site.yml. cephadm
# registers hosts under the name the node reports, so nodes are never renamed
# by the playbooks.

[bmc]
# Turing Pi 2 baseboard management controller (BusyBox; no python -> raw only)
turingpi ansible_host=192.168.1.31 ansible_user=root ansible_become=false

[nodes]
node1 ansible_host=node1.home.arpa turingpi_slot=1 node_ip=192.168.1.101
node2 ansible_host=node2.home.arpa turingpi_slot=2 node_ip=192.168.1.102
node3 ansible_host=node3.home.arpa turingpi_slot=3 node_ip=192.168.1.103
node4 ansible_host=node4.home.arpa turingpi_slot=4 node_ip=192.168.1.104

[nodes:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3

# ---------------------------------------------------------------- ceph ----
[ceph_mons]
node1
node2
node3

[ceph_mgrs]
node1
node2

[ceph_mdss]
node2
node3

[ceph_osds]
node1
node2
node3
node4

[ceph_rgws]
node1
node2
node3
node4

# S3 HA endpoint (haproxy + keepalived holding the S3 virtual IP on :443).
# Keep these hosts out of [dataplatform_gateway]: k3s servicelb forwards
# :80/:443 of every local address on its nodes, the virtual IP included.
[ceph_ingress]
node1
node4

# Prometheus, Alertmanager and Grafana (node-exporter and ceph-exporter run on
# every ceph host). Prometheus keeps its TSDB under /var/lib/ceph: pick hosts
# with room on /var.
[ceph_monitoring]
node2

[ceph:children]
ceph_mons
ceph_mgrs
ceph_mdss
ceph_osds
ceph_rgws
ceph_ingress
ceph_monitoring

# ---------------------------------------------------------------- k3s ----
# HA control plane with embedded etcd (odd number of servers). Servers are not
# tainted, so workloads run on every node.
[k3s_servers]
node1
node2
node3

[k3s_agents]
node4

[k3s:children]
k3s_servers
k3s_agents

# ------------------------------------------------------- data platform ----
# Argo CD-managed data platform on k3s (subsystems/dataplatform): settings in
# group_vars/dataplatform.yml, applied to every k3s node; its plays run on the
# first k3s server.
[dataplatform:children]
k3s

# k3s servicelb exposes the platform Gateway on :80/:443 of these nodes only,
# and the public name *.<dataplatform_domain> points at them. Keep them apart
# from ceph_ingress (servicelb would also catch the S3 virtual IP's :443).
[dataplatform_gateway]
node2
node3
