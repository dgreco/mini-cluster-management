---
# Create or converge one RGW user. Inputs:
#   ceph_rgw_user_uid, ceph_rgw_user_display_name, ceph_rgw_user_caps (a=*;b=*),
#   optional ceph_rgw_user_max_buckets.
# radosgw-admin generates the keys (a chosen key would sit on its command line,
# which cephadm logs); they are written to {{ secrets_dir }}/s3-<uid>.json on
# the control node.
- name: Look up user {{ ceph_rgw_user_uid }}
  ansible.builtin.command: cephadm shell -- radosgw-admin user info --uid={{ ceph_rgw_user_uid }}
  register: ceph_rgw_user_lookup
  changed_when: false
  failed_when: false

- name: Create user {{ ceph_rgw_user_uid }}
  ansible.builtin.command: >-
    cephadm shell -- radosgw-admin user create
    --uid={{ ceph_rgw_user_uid }}
    --display-name={{ ceph_rgw_user_display_name | default(ceph_rgw_user_uid) | quote }}
    {{ ('--max-buckets=' ~ ceph_rgw_user_max_buckets) if ceph_rgw_user_max_buckets | default('') | string | length > 0 else '' }}
  when: ceph_rgw_user_lookup.rc != 0
  no_log: true
  changed_when: true

- name: Re-read user {{ ceph_rgw_user_uid }}
  ansible.builtin.command: cephadm shell -- radosgw-admin user info --uid={{ ceph_rgw_user_uid }}
  register: ceph_rgw_user_info_raw
  changed_when: false
  no_log: true

- name: Parse user record
  ansible.builtin.set_fact:
    ceph_rgw_user_info: "{{ ceph_rgw_user_info_raw.stdout | from_json }}"
  no_log: true

- name: Reset cap list
  ansible.builtin.set_fact:
    ceph_rgw_user_current_caps: []

- name: Collect current caps
  ansible.builtin.set_fact:
    ceph_rgw_user_current_caps: "{{ ceph_rgw_user_current_caps + [item.type ~ '=' ~ item.perm] }}"
  loop: "{{ ceph_rgw_user_info.caps }}"
  loop_control:
    label: "{{ item.type }}"

- name: Compute missing caps
  ansible.builtin.set_fact:
    ceph_rgw_user_missing_caps: >-
      {{ (ceph_rgw_user_caps | default('') | split(';') | map('trim') | reject('equalto', '') | list)
         | difference(ceph_rgw_user_current_caps) }}

- name: Grant caps to {{ ceph_rgw_user_uid }}
  ansible.builtin.command: cephadm shell -- radosgw-admin caps add --uid={{ ceph_rgw_user_uid }} --caps={{ ceph_rgw_user_missing_caps | join(';') | quote }}
  when: ceph_rgw_user_missing_caps | length > 0
  changed_when: true

- name: Save keys locally
  ansible.builtin.copy:
    content: "{{ ceph_rgw_user_keyfile | to_nice_json }}\n"
    dest: "{{ secrets_dir }}/s3-{{ ceph_rgw_user_uid }}.json"
    mode: "0600"
  vars:
    ceph_rgw_user_keyfile:
      uid: "{{ ceph_rgw_user_uid }}"
      endpoint: "{{ ceph_rgw_endpoint }}"
      access_key: "{{ ceph_rgw_user_info['keys'][0].access_key }}"
      secret_key: "{{ ceph_rgw_user_info['keys'][0].secret_key }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Save a sourceable environment file for the aws CLI / boto3
  ansible.builtin.copy:
    content: |
      # Generated by subsystems/ceph (rgw_user.yml) for S3 user {{ ceph_rgw_user_uid }}.
      # Usage: source {{ secrets_dir | realpath }}/s3-{{ ceph_rgw_user_uid }}.env && aws s3 ls
      unset AWS_PROFILE AWS_SESSION_TOKEN
      export AWS_ACCESS_KEY_ID={{ ceph_rgw_user_info['keys'][0].access_key }}
      export AWS_SECRET_ACCESS_KEY={{ ceph_rgw_user_info['keys'][0].secret_key }}
      export AWS_DEFAULT_REGION=default
      export AWS_ENDPOINT_URL={{ ceph_rgw_endpoint }}
      export AWS_EC2_METADATA_DISABLED=true
      {% if ceph_rgw_ingress_enabled | bool and ceph_rgw_ingress_ssl | bool and not ceph_rgw_acme_active | bool %}
      export AWS_CA_BUNDLE={{ secrets_dir | realpath }}/rgw-ingress.crt
      {% endif %}
    dest: "{{ secrets_dir }}/s3-{{ ceph_rgw_user_uid }}.env"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
