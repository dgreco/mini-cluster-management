apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compute-spark-cleanup
  namespace: argocd
  annotations:
    # the last wave, like the other CronJobs: Argo CD rates a CronJob whose
    # last run failed Degraded, and the root app waits for each wave to be
    # healthy before the next
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dataplatform
  source:
    repoURL: git@github.com:your-account/mini-cluster-management.git
    targetRevision: main
    path: subsystems/dataplatform/gitops/manifests/compute/spark-cleanup
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
