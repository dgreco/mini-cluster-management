# External Secrets Operator. Its cert-controller writes the webhook CA at
# runtime, so the caBundle is not compared.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: dataplatform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: "2.11.0"
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/subsystems/dataplatform/gitops/helm-values/external-secrets-values.yaml
    - repoURL: git@github.com:your-account/mini-cluster-management.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: operators
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      # only what is written at runtime. With RespectIgnoreDifferences Argo CD
      # copies the ignored live fields into the apply: never .spec (a chart
      # upgrade would keep the old schema), never the whole .metadata
      # (managedFields is refused)
      jqPathExpressions:
        - .status
        - .metadata.labels
        - .metadata.annotations
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    # No finalizer and no prune: deleting this Application, or a chart that
  # drops a CRD, must not delete the custom resources with it
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
