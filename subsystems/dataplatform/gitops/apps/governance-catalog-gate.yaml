apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: governance-catalog-gate
  namespace: argocd
  annotations:
    # after the Hive Metastore (wave 0) and the Open Policy Agent (wave 1) it
    # stands between; with Spark (wave 2), whose jobs reach the catalog through it
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dataplatform
  source:
    repoURL: git@github.com:your-account/mini-cluster-management.git
    targetRevision: main
    path: subsystems/dataplatform/gitops/manifests/governance/catalog-gate
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
