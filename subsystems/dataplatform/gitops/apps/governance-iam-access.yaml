apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: governance-iam-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dataplatform
  source:
    repoURL: git@github.com:your-account/mini-cluster-management.git
    targetRevision: main
    path: subsystems/dataplatform/gitops/iam
  destination:
    server: https://kubernetes.default.svc
  # the record of grants: Argo CD creates it, Meta Catalog's scripts write it
  ignoreDifferences:
    - kind: ConfigMap
      name: metacatalog-grants
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
