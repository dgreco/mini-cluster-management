apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: governance-lam
  namespace: argocd
  annotations:
    # after the directory (wave 0) and the realm with its client (wave 1)
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dataplatform
  source:
    repoURL: git@github.com:your-account/mini-cluster-management.git
    targetRevision: main
    path: subsystems/dataplatform/gitops/manifests/governance/lam
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
