apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dataplatform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: "8.6.0"
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/subsystems/dataplatform/gitops/helm-values/kube-state-metrics-values.yaml
    - repoURL: git@github.com:your-account/mini-cluster-management.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
