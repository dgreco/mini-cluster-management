apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-otel-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dataplatform
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: "0.173.1"
      helm:
        releaseName: otel-agent
        valueFiles:
          - $values/subsystems/dataplatform/gitops/helm-values/otel-agent-values.yaml
    - repoURL: git@github.com:your-account/mini-cluster-management.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
