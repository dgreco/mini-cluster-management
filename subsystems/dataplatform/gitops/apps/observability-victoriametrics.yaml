apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-victoriametrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: dataplatform
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-single
      targetRevision: "0.47.0"
      helm:
        releaseName: victoria-metrics
        valueFiles:
          - $values/subsystems/dataplatform/gitops/helm-values/victoria-metrics-values.yaml
    - repoURL: git@github.com:your-account/mini-cluster-management.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    # No finalizer and no prune: deleting or renaming this Application in Git
  # must not take the data with it (the database cluster and its volumes)
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
