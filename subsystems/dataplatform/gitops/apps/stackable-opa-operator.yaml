# The Stackable OPA operator, same release as the other Stackable operators:
# it runs the Open Policy Agent (manifests/governance/opa), which decides
# Trino's statements.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackable-opa-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: dataplatform
  source:
    repoURL: oci://oci.stackable.tech/sdp-charts/opa-operator
    chart: opa-operator
    targetRevision: 26.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: operators
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      # only what is written at runtime. With RespectIgnoreDifferences Argo CD
      # copies the ignored live fields into the apply: never .spec (a chart
      # upgrade would keep the old schema), never the whole .metadata
      # (managedFields is refused)
      jqPathExpressions:
        - .status
        - .metadata.labels
        - .metadata.annotations
  syncPolicy:
    # No finalizer and no prune: deleting this Application, or a chart that
  # drops a CRD, must not delete the custom resources with it
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
