# cert-manager, in operators with the other operators (it serves only the
# Barman Cloud plugin's certificates).
crds:
  enabled: true
  keep: true
global:
  leaderElection:
    namespace: operators
# a Helm post-install hook: Argo CD would run it as a PostSync job on every sync
startupapicheck:
  enabled: false
# the pods carry prometheus.io annotations (port 9402) by default
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}
