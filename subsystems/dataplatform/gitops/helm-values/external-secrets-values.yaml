# External Secrets Operator: copies values from OpenBao into Kubernetes Secrets.
# Only namespaced SecretStores are used (one per namespace, each with its own
# OpenBao role), so cluster-wide stores are switched off.
installCRDs: true
processClusterStore: false
processClusterExternalSecret: false
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
