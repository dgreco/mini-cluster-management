# OpenTelemetry collector on every node: the logs of every pod
# (/var/log/pods), with Kubernetes metadata, to VictoriaLogs over OTLP (the
# default tenant: everything that is not a Stackable product). Stackable
# product logs take the Vector path to their own tenant instead. The one
# Stackable pod without a Vector agent, a Spark job's submit pod, is sent from
# here to the Stackable tenant.
# In this file '$$' is a literal '$' (the collector expands ${...}).
mode: daemonset
# the collector's own metrics (:8888), scraped by the cluster collector
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 384Mi}
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp: null
  exporters:
    otlphttp/victorialogs:
      logs_endpoint: http://victoria-logs.observability.svc:9428/insert/opentelemetry/v1/logs
      headers:
        # log streams: one per container
        VL-Stream-Fields: k8s.namespace.name,k8s.pod.name,k8s.container.name
    # the Stackable tenant, with the stream fields the Vector aggregator uses
    otlphttp/victorialogs-stackable:
      logs_endpoint: http://victoria-logs.observability.svc:9428/insert/opentelemetry/v1/logs
      headers:
        AccountID: "1"
        ProjectID: "0"
        VL-Stream-Fields: k8s.namespace.name,service.name,stackable.role,stackable.role_group,k8s.container.name
  connectors:
    # Spark submit pods (Stackable-managed, no Vector agent: the CRD has no
    # logging for the job) go to the Stackable tenant; everything else goes on
    # to the default tenant. A condition that fails routes to the default.
    routing/stackable:
      default_pipelines: [logs/default]
      error_mode: ignore
      table:
        - context: resource
          condition: attributes["k8s.container.name"] == "spark-submit" and IsMatch(attributes["app.kubernetes.io/managed-by"], ".+\\.stackable\\.tech_.+")
          pipelines: [logs/stackable]
  processors:
    # the pod labels that tell a Stackable-managed pod and its product
    k8sattributes:
      extract:
        labels:
          - tag_name: app.kubernetes.io/managed-by
            key: app.kubernetes.io/managed-by
            from: pod
          - tag_name: app.kubernetes.io/instance
            key: app.kubernetes.io/instance
            from: pod
    # Stackable products (Trino, Spark...) ship their logs through their Vector
    # agents to the Stackable tenant (vector-aggregator-values.yaml); their
    # console copy is dropped here, except the Vector agent's own log.
    filter/stackable-products:
      error_mode: ignore
      logs:
        log_record:
          - IsMatch(resource.attributes["app.kubernetes.io/managed-by"], ".+\\.stackable\\.tech_.+") and resource.attributes["k8s.container.name"] != "vector"
    # the fields of the Vector aggregator's records: product = the Spark
    # application, role = submit. The submit script traces its command line
    # (set -x), S3 keys included: the values are masked.
    transform/stackable-submit:
      error_mode: ignore
      log_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["app.kubernetes.io/instance"])
            - set(attributes["stackable.role"], "submit")
            - set(attributes["stackable.role_group"], "default")
        - context: log
          statements:
            - replace_pattern(body, "(?i)((access\\.key|secret\\.key|session\\.token|password|token)=)[^ ]+", "$$1***")
    resource/cluster:
      attributes:
        - {key: k8s.cluster.name, value: homelab, action: upsert}
        # who collected the record (Stackable products' logs: vector)
        - {key: log.collector, value: otel-agent, action: insert}
  service:
    pipelines:
      traces: null
      metrics: null
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, resource/cluster]
        exporters: [routing/stackable]
      logs/default:
        receivers: [routing/stackable]
        processors: [filter/stackable-products, batch]
        exporters: [otlphttp/victorialogs]
      logs/stackable:
        receivers: [routing/stackable]
        processors: [transform/stackable-submit, batch]
        exporters: [otlphttp/victorialogs-stackable]
