# The platform's own part of the data authorization model.
#
# Meta Catalog is the only place where data access is managed: every table
# is modelled there (subsystems/dataplatform/metacatalog), made by Meta
# Catalog's provisioner, and every grant comes from a table's policy once a
# member of platform-admins authorizes it there. Authorize writes the
# grants into the record of grants (ConfigMap governance/metacatalog-grants)
# and gives the Ceph RGW roles the table's folder; iam-sync derives Trino's
# S3 mapping and Trino's rules in the Open Policy Agent from the same record.
# This file keeps only what the platform itself needs; Argo CD hands it to
# iam-sync, make dataplatform-iam reads it for the platform's own roles.
#
#   bucket   the one bucket of the platform (created by make dataplatform-ceph)
#   admins   groups with every permission on the whole bucket (role
#            grp-<group>, kept by make dataplatform-iam) and on every table in
#            Trino; they create no schema or table either: Trino gives DDL to
#            the provisioner only, and only they may authorize or reject in
#            Meta Catalog
#   metacatalog
#     prefix       the directory under which Meta Catalog makes the tables'
#                  folders (<prefix>/<domain>/<subdomain>/<layer>/<table>) and
#                  grants them; nothing else can be granted
#     provisioner  the Keycloak user that creates every schema and table, the
#                  only one with DDL in Trino; it has rw on the prefix (role
#                  usr-<provisioner>, kept by make dataplatform-iam)
#
# A user or group named in a grant gets an STS role, usr-<user> or grp-<group>,
# whose policy is the union of its grants. Members log in with their Keycloak
# token (AssumeRoleWithWebIdentity); Trino assumes the role for them.
#
# Names: users and groups as in Keycloak (lower-case letters, digits, '-');
# the prefix: lower-case letters, digits, '.', '_', '-' and '/', no leading or
# trailing slash, not system/ (the platform's own: Spark's event logs).
# `make dataplatform-iam-check` validates this file; a `grants` list fails it.
bucket: dataplatform

admins:
  groups: [platform-admins]

metacatalog:
  prefix: lakehouse
  provisioner: service-account-metacatalog-provisioner
