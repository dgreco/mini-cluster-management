# The Spark jobs' catalog login: spark_writer, which reads the catalog and
# commits to existing tables but creates, drops and renames nothing (Meta
# Catalog makes every schema and table; catalog-security.sql). The PostgreSQL
# driver reads it from a pgpass file (dp-spark-submit.sh mounts this Secret,
# PGPASSFILE). The files are Ceph's to refuse, with the job's token and role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spark-catalog-logins
  namespace: compute
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: spark-catalog-logins
    template:
      engineVersion: v2
      data:
        pgpass: "iceberg-catalog-rw.governance.svc:5432:iceberg:{{ .username }}:{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/compute/iceberg-catalog-spark, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/compute/iceberg-catalog-spark, property: password}}
