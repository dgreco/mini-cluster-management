apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: the AuthenticationClass is cluster-scoped and Kustomize
# would put a namespace on it. Every object names its namespace.
resources:
  - trino-secrets.yaml
  - trino-authentication.yaml
  - trino-group-provider.yaml
  - trino-catalog-lakehouse.yaml
  - trino.yaml
  - trino-httproute.yaml
