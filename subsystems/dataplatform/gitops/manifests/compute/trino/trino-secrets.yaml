# From OpenBao:
# - trino-oidc: the Keycloak client trino (web UI login);
# - trino-s3: key of the RGW user trino. It has no permission of its own: the
#   group roles grp-<g> trust it to AssumeRole for an authenticated member;
# - iceberg-catalog: owner of the Iceberg JDBC catalog database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-oidc
  namespace: compute
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: trino-oidc
    template:
      data:
        clientId: trino
        clientSecret: "{{ .clientSecret }}"
  data:
    - {secretKey: clientSecret, remoteRef: {key: dataplatform/compute/trino-oidc, property: client-secret}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-s3
  namespace: compute
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: trino-s3
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - {secretKey: accessKey, remoteRef: {key: dataplatform/compute/trino-s3, property: access-key}}
    - {secretKey: secretKey, remoteRef: {key: dataplatform/compute/trino-s3, property: secret-key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iceberg-catalog
  namespace: compute
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: iceberg-catalog
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/compute/iceberg-catalog, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/compute/iceberg-catalog, property: password}}
