# https://argocd.data.example.org -> argocd-server (plain HTTP: TLS ends at
# the Gateway, server.insecure in bootstrap/argocd-values.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
spec:
  parentRefs:
    - name: main-gateway
      namespace: core
      sectionName: argocd-https
  hostnames:
    - argocd.data.example.org
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
