# https://openbao.data.example.org -> the active OpenBao node (UI and API).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
spec:
  parentRefs:
    - name: main-gateway
      namespace: core
      sectionName: openbao-https
  hostnames:
    - openbao.data.example.org
  rules:
    - backendRefs:
        - name: openbao-active
          port: 8200
