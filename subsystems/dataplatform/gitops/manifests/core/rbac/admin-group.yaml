# Kubernetes API logins through Keycloak (k3s_oidc_* in inventory/group_vars/
# k3s.yml): user oidc:<username>, groups oidc:<group>. Members of the Keycloak
# group platform-admins administer the cluster; data users only get the Spark
# jobs of compute (RoleBinding spark-submitter, written by iam-sync).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:platform-admins"
