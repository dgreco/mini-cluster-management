# Key of the RGW user spark (make dataplatform-ceph stores it in OpenBao).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-spark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: s3-spark
    template:
      mergePolicy: Merge
      metadata:
        labels:
          secrets.stackable.tech/class: s3-spark
  data:
    - secretKey: accessKey
      remoteRef:
        key: dataplatform/compute/spark-s3
        property: access-key
    - secretKey: secretKey
      remoteRef:
        key: dataplatform/compute/spark-s3
        property: secret-key
