# Stackable SecretClass for the static S3 key of Spark's event logs (RGW user
# spark): the credentials are the Secret labelled with this class in the pod's
# own namespace (compute). Data files are never read with it: jobs use STS
# (web identity).
apiVersion: secrets.stackable.tech/v1alpha1
kind: SecretClass
metadata:
  name: s3-spark
spec:
  backend:
    k8sSearch:
      searchNamespace:
        pod: {}
---
# Likewise for the Hive Metastore (governance): the key of the RGW user hive,
# the Secret governance/hive-s3 (manifests/governance/hive-metastore). It
# lists the tables' directories and reaches their Iceberg metadata, no data
# file.
apiVersion: secrets.stackable.tech/v1alpha1
kind: SecretClass
metadata:
  name: s3-hive
spec:
  backend:
    k8sSearch:
      searchNamespace:
        pod: {}
