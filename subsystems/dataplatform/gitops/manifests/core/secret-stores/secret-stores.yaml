# One SecretStore per namespace. Each logs in to OpenBao (Kubernetes auth) as
# its own service account external-secrets-store, with the OpenBao role named
# after the namespace, which may only read secret/dataplatform/<namespace>/*.
# Roles and policies are created by Ansible (make dataplatform-openbao).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-store
  namespace: argocd
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: argocd
spec:
  provider:
    vault:
      server: http://openbao-active.governance.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argocd
          serviceAccountRef:
            name: external-secrets-store
