# The key of the RGW user backup, owner of the bucket platform-backups
# (subsystems/ceph, ceph_rgw_backup_*): PostgreSQL backups (CloudNativePG,
# hive-metastore-db and keycloak-db) and the OpenBao snapshots go there. From
# OpenBao, written by make dataplatform-ceph.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
  namespace: governance
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: backup-s3
    template:
      engineVersion: v2
  data:
    - {secretKey: access-key, remoteRef: {key: dataplatform/governance/backup-s3, property: access-key}}
    - {secretKey: secret-key, remoteRef: {key: dataplatform/governance/backup-s3, property: secret-key}}
