apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: it would move the Role meant for compute
# (catalog-gate-rbac.yaml) into governance. Every object names its namespace.
resources:
  - catalog-gate-rbac.yaml
  - catalog-gate.yaml
# The gate's program; a change rolls the Deployment (name hash).
configMapGenerator:
  - name: catalog-gate-script
    namespace: governance
    files:
      - catalog_gate.py
