# From OpenBao:
# - hive-metastore-db-owner: the owner of the metastore's database, for
#   CloudNativePG (which makes the role) and for the metastore (its login);
# - hive-s3: the key of the RGW user hive, which sees the tables' directories
#   in the platform bucket and reads and writes the Iceberg metadata in them,
#   no data file (make dataplatform-ceph).
#   The label makes it the credentials of the SecretClass s3-hive
#   (manifests/core/s3) for the pods of this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive-metastore-db-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hive-metastore-db-owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/governance/hive-metastore-db, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/governance/hive-metastore-db, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hive-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hive-s3
    # a template keeps this ExternalSecret's own annotations (force-sync,
    # Argo CD's) off the Secret: every copy is a write, and the Stackable
    # products restart on any write of their Secrets
    template:
      engineVersion: v2
      metadata:
        labels:
          secrets.stackable.tech/class: s3-hive
  data:
    - {secretKey: accessKey, remoteRef: {key: dataplatform/governance/hive-s3, property: access-key}}
    - {secretKey: secretKey, remoteRef: {key: dataplatform/governance/hive-s3, property: secret-key}}
