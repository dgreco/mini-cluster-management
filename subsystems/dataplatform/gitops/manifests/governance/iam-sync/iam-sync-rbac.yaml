# What iam-sync may do: in governance, read the record of grants and patch
# the ConfigMap trino-grants (both below); in compute, write the ConfigMap
# trino-iam and the RoleBinding spark-submitter (server-side apply), whose
# only allowed role is dataplatform-spark-submitter. The admission policy in
# iam-sync-policy.yaml pins it to those three names.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-sync
  namespace: governance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-sync
  namespace: compute
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [dataplatform-spark-submitter]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-sync
  namespace: compute
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iam-sync
subjects:
  - kind: ServiceAccount
    name: iam-sync
    namespace: governance
---
# The record of grants (governance/metacatalog-grants, written by Meta
# Catalog's authorize and reject): read only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-sync-grants-reader
  namespace: governance
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [metacatalog-grants]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-sync-grants-reader
  namespace: governance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iam-sync-grants-reader
subjects:
  - kind: ServiceAccount
    name: iam-sync
    namespace: governance
---
# What the Open Policy Agent reads of the record (governance/trino-grants,
# gitops/iam/trino-grants.yaml: Argo CD makes it): iam-sync writes its data,
# and can neither make nor delete a ConfigMap here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-sync-trino-grants
  namespace: governance
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [trino-grants]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-sync-trino-grants
  namespace: governance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iam-sync-trino-grants
subjects:
  - kind: ServiceAccount
    name: iam-sync
    namespace: governance
