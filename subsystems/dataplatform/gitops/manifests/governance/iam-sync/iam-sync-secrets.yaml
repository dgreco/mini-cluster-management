# The Keycloak client secret of iam-sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-sync-keycloak
  namespace: governance
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: iam-sync-keycloak
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - {secretKey: client-secret, remoteRef: {key: dataplatform/governance/iam-sync, property: client-secret}}
