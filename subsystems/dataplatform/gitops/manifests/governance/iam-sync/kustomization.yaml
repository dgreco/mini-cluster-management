apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: it would move the Role meant for compute (iam-sync-rbac.yaml)
# into governance. Every object names its namespace.
resources:
  - iam-sync-secrets.yaml
  - iam-sync-rbac.yaml
  - iam-sync-policy.yaml
  - iam-sync.yaml
# The script; a change rolls the Deployment (name hash).
configMapGenerator:
  - name: iam-sync-script
    namespace: governance
    files:
      - iam_sync.py
