# The Iceberg catalog (JDBC catalog, schema V1): which tables exist and where
# their current metadata file is. It never touches data: files are read and
# written by Trino and Spark with the user's STS credentials.
# The bookkeeping tables are created here at bootstrap (Trino does not create
# them). Trino logs in as the owner, the Spark jobs as spark_writer (no table
# or schema of their own); catalog-security.sql (also applied by
# make dataplatform-iam) makes the roles.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iceberg-catalog
spec:
  instances: 2
  storage:
    storageClass: ceph-rbd
    size: 2Gi
  bootstrap:
    initdb:
      database: iceberg
      owner: iceberg
      secret:
        name: iceberg-catalog-owner
      postInitApplicationSQL:
        - >-
          CREATE TABLE IF NOT EXISTS iceberg_tables (
            catalog_name VARCHAR(255) NOT NULL, table_namespace VARCHAR(255) NOT NULL,
            table_name VARCHAR(255) NOT NULL, metadata_location VARCHAR(1000),
            previous_metadata_location VARCHAR(1000), iceberg_type VARCHAR(5),
            PRIMARY KEY (catalog_name, table_namespace, table_name))
        - >-
          CREATE TABLE IF NOT EXISTS iceberg_namespace_properties (
            catalog_name VARCHAR(255) NOT NULL, namespace VARCHAR(255) NOT NULL,
            property_key VARCHAR(255), property_value VARCHAR(1000),
            PRIMARY KEY (catalog_name, namespace, property_key))
        - ALTER TABLE iceberg_tables OWNER TO iceberg
        - ALTER TABLE iceberg_namespace_properties OWNER TO iceberg
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: iceberg-catalog-init
            key: catalog-security.sql
  # Continuous WAL archiving and the nightly base backups go through the
  # Barman Cloud plugin to the ObjectStore iceberg-catalog (iceberg-catalog-objectstore.yaml):
  # s3://platform-backups/cnpg/iceberg-catalog/iceberg-catalog/, with the backup key.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: iceberg-catalog
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
