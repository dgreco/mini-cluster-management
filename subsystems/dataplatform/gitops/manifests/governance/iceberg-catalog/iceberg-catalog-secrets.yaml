# Owner of the catalog database (Trino), from OpenBao. The group roles Spark
# jobs use are made by make dataplatform-iam; their passwords reach the jobs
# through iam-sync (governance/iam-sync).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iceberg-catalog-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: iceberg-catalog-owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/governance/iceberg-catalog-db, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/governance/iceberg-catalog-db, property: password}}
