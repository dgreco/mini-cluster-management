apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: governance
resources:
  - iceberg-catalog-secrets.yaml
  - iceberg-catalog-db.yaml
  - iceberg-catalog-objectstore.yaml
  - iceberg-catalog-backup.yaml
# Row-level security of the catalog, run at bootstrap (and by make
# dataplatform-iam from the same file). A fixed name: the Cluster refers to it.
configMapGenerator:
  - name: iceberg-catalog-init
    files:
      - catalog-security.sql
    options:
      disableNameSuffixHash: true
