# Client secrets and the first user's password, substituted into the realm at
# its creation (placeholders in realm-import.yaml). make dataplatform-iam keeps
# the running realm in line with the same values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: keycloak-realm-secrets
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - {secretKey: argocd, remoteRef: {key: dataplatform/governance/keycloak-clients, property: argocd}}
    - {secretKey: grafana, remoteRef: {key: dataplatform/governance/keycloak-clients, property: grafana}}
    - {secretKey: openbao, remoteRef: {key: dataplatform/governance/keycloak-clients, property: openbao}}
    - {secretKey: trino, remoteRef: {key: dataplatform/governance/keycloak-clients, property: trino}}
    - {secretKey: jupyterhub, remoteRef: {key: dataplatform/governance/keycloak-clients, property: jupyterhub}}
    - {secretKey: s3browser, remoteRef: {key: dataplatform/governance/keycloak-clients, property: s3browser}}
    - {secretKey: vmui, remoteRef: {key: dataplatform/governance/keycloak-clients, property: vmui}}
    - {secretKey: metacatalog, remoteRef: {key: dataplatform/governance/keycloak-clients, property: metacatalog}}
    - {secretKey: metacatalog-provisioner, remoteRef: {key: dataplatform/governance/keycloak-clients, property: metacatalog-provisioner}}
    - {secretKey: iam-sync, remoteRef: {key: dataplatform/governance/keycloak-clients, property: iam-sync}}
    - {secretKey: smoke-test, remoteRef: {key: dataplatform/governance/keycloak-clients, property: smoke-test}}
    - {secretKey: admin-password, remoteRef: {key: dataplatform/governance/platform-admin, property: password}}
