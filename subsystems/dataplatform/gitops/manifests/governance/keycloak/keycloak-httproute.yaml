# https://keycloak.data.example.org -> Keycloak (HTTP port 8080).
# The master realm (its console and its admin API) is not reachable from
# outside: Ansible calls the admin API inside the cluster, and the master
# realm has no other user. The data-platform realm's console stays, behind
# its login, for the platform-admins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs:
    - name: main-gateway
      namespace: core
      sectionName: keycloak-https
  hostnames:
    - keycloak.data.example.org
  rules:
    - matches:
        - path: {type: PathPrefix, value: /admin/master}
        - path: {type: PathPrefix, value: /admin/realms/master}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /}
            statusCode: 302
    - backendRefs:
        - name: keycloak-service
          port: 8080
