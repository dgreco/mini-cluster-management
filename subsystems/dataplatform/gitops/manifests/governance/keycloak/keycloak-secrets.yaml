# From OpenBao (make dataplatform-openbao generates them once).
# Database owner of the keycloak database (CNPG bootstrap and Keycloak).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: keycloak-db
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: dataplatform/governance/keycloak-db
        property: username
    - secretKey: password
      remoteRef:
        key: dataplatform/governance/keycloak-db
        property: password
---
# Temporary admin of the master realm, created at the first start. Everyday
# administration of the platform realm goes through its platform-admins group.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: keycloak-bootstrap-admin
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - secretKey: username
      remoteRef:
        key: dataplatform/governance/keycloak-admin
        property: username
    - secretKey: password
      remoteRef:
        key: dataplatform/governance/keycloak-admin
        property: password
