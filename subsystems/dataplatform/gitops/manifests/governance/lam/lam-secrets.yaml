# What LDAP Account Manager and the oauth2-proxy in front of it need: the
# password of the directory account LAM looks a login's entry up with (the
# read-only bind account, the one Keycloak uses), and the proxy's Keycloak
# client secret and cookie key, as its environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: lam
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret
    template:
      engineVersion: v2
  data:
    - {secretKey: bind-password, remoteRef: {key: dataplatform/governance/samba-ad, property: bind-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lam-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: lam-proxy
    template:
      engineVersion: v2
  data:
    - {secretKey: OAUTH2_PROXY_CLIENT_SECRET, remoteRef: {key: dataplatform/governance/keycloak-clients, property: directory}}
    - {secretKey: OAUTH2_PROXY_COOKIE_SECRET, remoteRef: {key: dataplatform/governance/directory-proxy, property: cookie-secret}}
