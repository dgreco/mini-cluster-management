# A base backup every night (CloudNativePG's cron has a seconds field), on top
# of the continuous WAL archiving of the Cluster; the first one right away.
# Taken by the Barman Cloud plugin, into the Cluster's ObjectStore.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: metacatalog-db-daily
spec:
  schedule: "0 45 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: metacatalog-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
