# The record of grants itself (ConfigMap metacatalog-grants) is
# gitops/iam/metacatalog-grants.yaml (governance-iam-access, wave 1).
# What the scripts need to reach Ceph (its IAM for the roles, its STS and S3
# for the tables' folders) and to name the platform's tables: the platform's
# values (as inventory/group_vars/dataplatform.yml; make dataplatform-render
# checks the endpoint, region and account). IAM_PLATFORM_ROLES are the roles
# Ansible keeps (make dataplatform-iam: access.yaml's admin groups and Meta
# Catalog's provisioner); the scripts never touch them, and their RGW user
# may not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metacatalog-iam
data:
  GRANTS_CONFIGMAP: metacatalog-grants
  LAKEHOUSE_BUCKET: dataplatform
  LAKEHOUSE_PREFIX: lakehouse                      # access.yaml metacatalog.prefix
  LAKEHOUSE_CATALOG: lakehouse                     # Trino's catalog (trino-catalog-lakehouse.yaml)
  IAM_ENDPOINT: https://s3.example.org
  STS_ENDPOINT: https://s3.example.org
  S3_ENDPOINT: https://s3.example.org
  IAM_REGION: us-east-1
  IAM_ACCOUNT_ID: RGW00000000000000001
  IAM_OIDC_PROVIDER: keycloak.data.example.org/realms/data-platform
  IAM_TRINO_USER: trino
  IAM_MAX_SESSION: "43200"
  IAM_PLATFORM_ROLES: grp-platform-admins usr-service-account-metacatalog-provisioner
  IAM_KEY_DIR: /etc/metacatalog/iam
---
# Meta Catalog's pod (its scripts write the record) and iam-reconcile (reads
# it) talk to the Kubernetes API for that one ConfigMap only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metacatalog
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-reconcile
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metacatalog-grants-writer
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [metacatalog-grants]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metacatalog-grants-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metacatalog-grants-writer
subjects:
  - kind: ServiceAccount
    name: metacatalog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metacatalog-grants-reader
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [metacatalog-grants]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metacatalog-grants-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metacatalog-grants-reader
subjects:
  - kind: ServiceAccount
    name: iam-reconcile
