# Owner of Meta Catalog's database (OpenBao governance/metacatalog-db): the
# Cluster's bootstrap and the application log in with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metacatalog-db-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: metacatalog-db-owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/governance/metacatalog-db, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/governance/metacatalog-db, property: password}}
---
# The client secret of the Keycloak client metacatalog (OpenBao
# governance/keycloak-clients, read in place: same namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metacatalog-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: metacatalog-oidc
    template:
      engineVersion: v2
  data:
    - {secretKey: client-secret, remoteRef: {key: dataplatform/governance/keycloak-clients, property: metacatalog}}
---
# The client secret of the Keycloak client metacatalog-provisioner (OpenBao
# governance/keycloak-clients): the provisioning scripts log in to Trino with
# it (provisioning/lib-trino.sh). Mounted as a file, read at each run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metacatalog-provisioner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: metacatalog-provisioner
    template:
      engineVersion: v2
  data:
    - {secretKey: client-secret, remoteRef: {key: dataplatform/governance/keycloak-clients, property: metacatalog-provisioner}}
---
# The S3 key of the RGW user metacatalog-iam (OpenBao governance/metacatalog-iam,
# from make dataplatform-ceph): authorize, reject and iam-reconcile manage
# the usr-* and grp-* STS roles with it (provisioning/lib-iam.sh); its IAM
# user policy allows nothing else. Mounted as files, read at each call.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metacatalog-iam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: metacatalog-iam
    template:
      engineVersion: v2
  data:
    - {secretKey: access-key, remoteRef: {key: dataplatform/governance/metacatalog-iam, property: access-key}}
    - {secretKey: secret-key, remoteRef: {key: dataplatform/governance/metacatalog-iam, property: secret-key}}
---
# oauth2-proxy in front of Meta Catalog (metacatalog-proxy.yaml): the client
# secret of metacatalog (OpenBao governance/keycloak-clients, same namespace)
# and its cookie key (OpenBao governance/metacatalog-proxy, 32 generated
# characters), as its environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metacatalog-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: metacatalog-proxy
    template:
      engineVersion: v2
  data:
    - {secretKey: OAUTH2_PROXY_CLIENT_SECRET, remoteRef: {key: dataplatform/governance/keycloak-clients, property: metacatalog}}
    - {secretKey: OAUTH2_PROXY_COOKIE_SECRET, remoteRef: {key: dataplatform/governance/metacatalog-proxy, property: cookie-secret}}
