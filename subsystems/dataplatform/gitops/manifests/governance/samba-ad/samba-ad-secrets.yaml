# The directory's passwords, read by the domain controller at every start:
# the domain's Administrator, the account Keycloak reads the directory as
# (make dataplatform-iam gives Keycloak the same value), and the first
# administrator's (created once: see adctl seed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: samba-ad
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: samba-ad
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret
    template:
      engineVersion: v2
  data:
    - {secretKey: admin-password, remoteRef: {key: dataplatform/governance/samba-ad, property: admin-password}}
    - {secretKey: bind-password, remoteRef: {key: dataplatform/governance/samba-ad, property: bind-password}}
    - {secretKey: first-admin-password, remoteRef: {key: dataplatform/governance/platform-admin, property: password}}
