# https://grafana.data.example.org -> Grafana
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: main-gateway
      namespace: core
      sectionName: grafana-https
  hostnames:
    - grafana.data.example.org
  rules:
    - backendRefs:
        - name: grafana
          port: 80
