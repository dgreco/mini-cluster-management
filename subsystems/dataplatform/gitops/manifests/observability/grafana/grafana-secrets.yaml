# Grafana's local admin and the client secret of the Keycloak client grafana,
# from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: grafana-admin
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - {secretKey: admin-user, remoteRef: {key: dataplatform/observability/grafana-admin, property: admin-user}}
    - {secretKey: admin-password, remoteRef: {key: dataplatform/observability/grafana-admin, property: admin-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: grafana-oidc
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret: every copy is a
    # write, and the Stackable products restart on any write of their Secrets
    template:
      engineVersion: v2
  data:
    - {secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, remoteRef: {key: dataplatform/observability/grafana-oidc, property: client-secret}}
