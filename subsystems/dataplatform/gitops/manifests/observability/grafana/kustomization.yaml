apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - grafana-secrets.yaml
  - grafana-httproute.yaml
# dashboards kept here (JSON), loaded by Grafana's sidecar (label
# grafana_dashboard=1) into the folder named by grafana_folder
configMapGenerator:
  - name: grafana-dashboard-logs
    files:
      - dashboards/logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Logs
