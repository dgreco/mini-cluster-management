apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
# VictoriaMetrics' own UI (VMUI, victoria-metrics:8428 under /vmui) and
# VictoriaLogs' (victoria-logs:9428 under /select/vmui) at
# https://vmui.data.example.org, behind oauth2-proxy (Keycloak client vmui,
# platform-admins only) and a read-only path list at the Gateway.
resources:
  - vmui-secrets.yaml
  - vmui.yaml
  - vmui-httproute.yaml
