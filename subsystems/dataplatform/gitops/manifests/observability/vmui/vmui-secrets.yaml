# oauth2-proxy's Keycloak client secret (OpenBao observability/vmui-oidc, a
# copy of governance/keycloak-clients#vmui) and its cookie key (OpenBao
# observability/vmui-proxy, 32 generated characters), as its environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmui-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: vmui-proxy
    # a template, even without rules, keeps this ExternalSecret's own
    # annotations (force-sync, Argo CD's) off the Secret
    template:
      engineVersion: v2
  data:
    - {secretKey: OAUTH2_PROXY_CLIENT_SECRET, remoteRef: {key: dataplatform/observability/vmui-oidc, property: client-secret}}
    - {secretKey: OAUTH2_PROXY_COOKIE_SECRET, remoteRef: {key: dataplatform/observability/vmui-proxy, property: cookie-secret}}
