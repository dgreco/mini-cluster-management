# Keycloak operator 26.7.4: the official manifests (all four CRDs; the operator
# also runs the client controllers) moved to governance, where it watches the
# Keycloak and KeycloakRealmImport resources. setRoleBindingSubjects also moves
# the ServiceAccount subjects of the (cluster) role bindings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.7.4/kubernetes/keycloakoidcclients.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.7.4/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.7.4/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.7.4/kubernetes/keycloaksamlclients.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.7.4/kubernetes/kubernetes.yml
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: governance
      namespace: governance
    setRoleBindingSubjects: allServiceAccounts
    fieldSpecs:
    - path: metadata/namespace
      create: true
patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 512Mi}
