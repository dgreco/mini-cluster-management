# https://airflow.data.example.org -> Airflow's API server (the web UI and the API;
# Stackable's listener Service airflow-webserver). The login is Airflow's own
# with Keycloak (airflow.yaml), so no proxy in front.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
spec:
  parentRefs:
    - name: main-gateway
      namespace: core
      sectionName: airflow-https
  hostnames:
    - airflow.data.example.org
  rules:
    - backendRefs:
        - name: airflow-webserver
          port: 8080
