# Airflow's Secrets, each from OpenBao (secret/dataplatform/tools/*) through
# the namespace's SecretStore.
#
# Owner of Airflow's database (OpenBao tools/airflow-db): the Cluster's
# bootstrap and Airflow log in with it (Stackable reads username, password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-db-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: airflow-db-owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/tools/airflow-db, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/tools/airflow-db, property: password}}
---
# The user the scheduler makes in Airflow's own user table at its first start
# (Stackable requires one; OpenBao tools/airflow-admin). Nobody logs in with
# it: the login is Keycloak's only (AUTH_OAUTH), which shows no password form.
# Its name is no directory user's, so no person is ever taken for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: airflow-admin
    template:
      engineVersion: v2
      data:
        adminUser.username: "{{ .username }}"
        adminUser.firstname: Airflow
        adminUser.lastname: Bootstrap
        adminUser.email: "{{ .username }}@airflow.invalid"
        adminUser.password: "{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: dataplatform/tools/airflow-admin, property: username}}
    - {secretKey: password, remoteRef: {key: dataplatform/tools/airflow-admin, property: password}}
---
# The Keycloak client airflow (OpenBao tools/airflow-oidc, a copy of
# governance/keycloak-clients#airflow), as Stackable reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: airflow-oidc
    template:
      engineVersion: v2
      data:
        clientId: airflow
        clientSecret: "{{ .secret }}"
  data:
    - {secretKey: secret, remoteRef: {key: dataplatform/tools/airflow-oidc, property: client-secret}}
---
# The Keycloak client lakehouse-pipeline (OpenBao tools/lakehouse-pipeline, a
# copy of governance/keycloak-clients#lakehouse-pipeline): the identity the
# example's DAGs run as (its service account). Mounted into the task pods
# only, as a file read at each task.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakehouse-pipeline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: lakehouse-pipeline
    template:
      engineVersion: v2
  data:
    - {secretKey: client-secret, remoteRef: {key: dataplatform/tools/lakehouse-pipeline, property: client-secret}}
---
# git-sync's read access to the deployment repository (OpenBao
# tools/airflow-git, written by make dataplatform-openbao: the deploy key,
# dataplatform_airflow_git_ssh_key_file, and the server's host keys of
# gitops/bootstrap/known_hosts, so a server that presents others is refused).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-git
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: airflow-git
    template:
      engineVersion: v2
  data:
    - {secretKey: key, remoteRef: {key: dataplatform/tools/airflow-git, property: key}}
    - {secretKey: knownHosts, remoteRef: {key: dataplatform/tools/airflow-git, property: knownHosts}}
---
# The backup user's S3 key (OpenBao tools/backup-s3, written by make
# dataplatform-ceph): the Barman Cloud plugin archives airflow-db with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: backup-s3
    template:
      engineVersion: v2
  data:
    - {secretKey: access-key, remoteRef: {key: dataplatform/tools/backup-s3, property: access-key}}
    - {secretKey: secret-key, remoteRef: {key: dataplatform/tools/backup-s3, property: secret-key}}
