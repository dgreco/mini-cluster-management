# https://jupyter.data.example.org -> JupyterHub's proxy
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jupyterhub
spec:
  parentRefs:
    - name: main-gateway
      namespace: core
      sectionName: jupyter-https
  hostnames:
    - jupyter.data.example.org
  rules:
    - backendRefs:
        - name: proxy-public
          port: 80
