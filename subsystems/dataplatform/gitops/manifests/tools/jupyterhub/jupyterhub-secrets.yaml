# JupyterHub's own secrets, from OpenBao (hub.existingSecret in
# helm-values/jupyterhub-values.yaml): the client secret of the Keycloak
# client jupyterhub (merged into the hub's values through values.yaml), the
# cookie secret and the key that encrypts the users' auth state. JupyterHub
# wants the last two as hex, so the generated values are hashed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jupyterhub-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: jupyterhub-hub
    template:
      engineVersion: v2
      data:
        values.yaml: |
          hub:
            config:
              GenericOAuthenticator:
                client_secret: {{ .clientSecret | quote }}
        hub.config.JupyterHub.cookie_secret: "{{ .cookieSecret | sha256sum }}"
        hub.config.CryptKeeper.keys: "{{ .cryptKey | sha256sum }}"
  data:
    - {secretKey: clientSecret, remoteRef: {key: dataplatform/tools/jupyterhub-oidc, property: client-secret}}
    - {secretKey: cookieSecret, remoteRef: {key: dataplatform/tools/jupyterhub, property: cookie-secret}}
    - {secretKey: cryptKey, remoteRef: {key: dataplatform/tools/jupyterhub, property: crypt-key}}
