apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools
resources:
  - s3browser-secrets.yaml
  - s3browser.yaml
  - s3browser-httproute.yaml
# The program; a change rolls the Deployment (name hash).
configMapGenerator:
  - name: s3browser-script
    files:
      - s3browser.py
