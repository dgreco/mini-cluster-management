# The client secret of the Keycloak client s3browser (OpenBao
# tools/s3browser-oidc, a copy of governance/keycloak-clients#s3browser).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3browser-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: s3browser-oidc
    template:
      engineVersion: v2
  data:
    - {secretKey: client-secret, remoteRef: {key: dataplatform/tools/s3browser-oidc, property: client-secret}}
