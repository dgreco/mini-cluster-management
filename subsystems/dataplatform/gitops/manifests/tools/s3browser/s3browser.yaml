# The S3 browser of the administrators (s3browser.py): read-only, each
# administrator's own Keycloak login exchanged at Ceph's STS for the admin
# role; no S3 key in the cluster. One replica: sessions live in memory (a
# restart logs everyone out).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3browser
  labels:
    app.kubernetes.io/name: s3browser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: s3browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3browser
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3browser
          image: docker.io/library/python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: [python3, -u, /app/s3browser.py]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ISSUER, value: https://keycloak.data.example.org/realms/data-platform}
            - {name: CLIENT_ID, value: s3browser}
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: s3browser-oidc, key: client-secret}
            - {name: PUBLIC_URL, value: https://s3browser.data.example.org}
            - {name: S3_ENDPOINT, value: https://s3.example.org}
            - {name: S3_REGION, value: us-east-1}
            - {name: ROLE_ARN, value: "arn:aws:iam::RGW00000000000000001:role/grp-platform-admins"}
            - {name: ADMIN_GROUPS, value: platform-admins}
            - {name: INDEX_BUCKET, value: dataplatform}
            - {name: INDEX_KEY, value: system/admin-browser/buckets.json}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
      volumes:
        - name: script
          configMap:
            name: s3browser-script
---
apiVersion: v1
kind: Service
metadata:
  name: s3browser
  labels:
    app.kubernetes.io/name: s3browser
spec:
  selector:
    app.kubernetes.io/name: s3browser
  ports:
    - {name: http, port: 80, targetPort: http}
