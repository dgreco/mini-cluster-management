---
# Task-file hook included by cluster/rolling-reboot.yml for each node after the
# k3s exit hook: return only once the data platform is whole again (OpenBao
# 3/3 unsealed, Keycloak ready, the directory's domain controller ready, every
# CloudNativePG cluster with all its instances, every Argo CD Application
# Healthy), so the next node can go.
- name: Find a k3s server that answers
  ansible.builtin.include_tasks: ../../k3s/hooks/pick-server.yml
  when: inventory_hostname in groups['k3s'] | default([])

# Installed = Argo CD present and the Keycloak resource created; earlier than
# that (mid-install) there is nothing to wait for.
- name: Is the data platform installed?
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl get namespace argocd -o name
    --request-timeout=10s && /usr/local/bin/k3s kubectl -n governance get keycloak keycloak -o name --request-timeout=10s
  delegate_to: "{{ k3s_maint_server }}"
  register: dataplatform_maint_probe
  changed_when: false
  failed_when: false
  when: k3s_maint_member | default(false)

- name: Wait until the data platform is healthy again
  ansible.builtin.shell: |
    set -o pipefail
    k="/usr/local/bin/k3s kubectl"
    end=$((SECONDS + {{ dataplatform_recover_timeout }}))
    while :; do
      bad=$($k -n argocd get applications -o 'jsonpath={range .items[*]}{.metadata.name}={.status.health.status}{"\n"}{end}' \
            | grep -v '=Healthy$' || true)
      bao=$($k -n {{ dataplatform_openbao_namespace }} get statefulset openbao -o 'jsonpath={.status.readyReplicas}/{.spec.replicas}')
      kc=$($k -n governance get keycloak keycloak -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}')
      pg=$($k get clusters.postgresql.cnpg.io -A -o 'jsonpath={range .items[*]}{.metadata.name}={.status.readyInstances}/{.spec.instances}{"\n"}{end}' \
           | awk -F'[=/]' '$2 != $3')
      # the one domain controller moves with its volume when its node drains;
      # empty where the directory is not deployed (yet)
      ad=$($k -n {{ dataplatform_directory_namespace }} get statefulset samba-ad \
           -o 'jsonpath={.status.readyReplicas}/{.spec.replicas}' 2>/dev/null || true)
      [ -z "$bad" ] && [ "$bao" = 3/3 ] && [ "$kc" = True ] && [ -z "$pg" ] && { [ -z "$ad" ] || [ "$ad" = 1/1 ]; } && exit 0
      if [ $SECONDS -ge $end ]; then
        echo "not recovered after {{ dataplatform_recover_timeout }} s: apps ${bad:-ok}; openbao $bao; keycloak $kc;" \
             "directory ${ad:-none}; postgres ${pg:-ok}" >&2
        exit 1
      fi
      sleep 15
    done
  args:
    executable: /bin/bash
  delegate_to: "{{ k3s_maint_server }}"
  changed_when: false
  when: dataplatform_maint_probe.rc | default(1) == 0
