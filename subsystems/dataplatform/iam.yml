---
# The IAM model (make dataplatform-iam): the Keycloak realm converged from Git,
# its people and groups read from the directory (Samba AD) through a user
# federation, Ceph RGW trusting the realm, the platform's own STS roles,
# OpenBao logins through Keycloak. A new group or a changed
# membership in the directory needs no run of this. A realm that still holds
# users of its own (before the directory): once,
#   make dataplatform-iam ARGS="-e dataplatform_iam_adopt_directory=true"
- name: Identity and access
  hosts: "{{ groups['ceph_mons'][0] }}"
  gather_facts: false
  roles:
    - dataplatform_iam
