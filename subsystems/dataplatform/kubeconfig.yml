---
# A kubeconfig that logs in to the Kubernetes API through Keycloak
# (kubelogin: brew install int128/kubelogin/kubelogin, or kubectl krew install
# oidc-login). Anyone can use the same file: the login decides who they are
# (oidc:<username>) and RBAC what they may do (Spark jobs in compute; the
# admin group: everything).
#   make dataplatform-kubeconfig
#   KUBECONFIG=.secrets/kubeconfig-oidc.yaml kubectl -n spark-<you> get pods
- name: Keycloak kubeconfig
  hosts: "{{ groups['k3s_servers'][0] }}"
  gather_facts: false
  tasks:
    - name: Cluster endpoint and CA of the admin kubeconfig - {{ k3s_kubeconfig }}
      ansible.builtin.set_fact:
        kubeconfig_admin: "{{ lookup('ansible.builtin.file', k3s_kubeconfig) | from_yaml }}"

    - name: Write .secrets/kubeconfig-oidc.yaml
      ansible.builtin.copy:
        content: "{{ _config | to_nice_yaml(indent=2) }}"
        dest: "{{ secrets_dir }}/kubeconfig-oidc.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        _config:
          apiVersion: v1
          kind: Config
          clusters:
            - name: "{{ site_cluster_name }}"
              cluster: "{{ kubeconfig_admin.clusters[0].cluster }}"
          users:
            - name: keycloak
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: kubectl
                  args:
                    - oidc-login
                    - get-token
                    - --oidc-issuer-url={{ k3s_oidc_issuer_url }}
                    - --oidc-client-id={{ k3s_oidc_client_id }}
                    - --oidc-extra-scope=profile
                  interactiveMode: IfAvailable
          contexts:
            - name: dataplatform
              context:
                cluster: "{{ site_cluster_name }}"
                user: keycloak
          current-context: dataplatform

    - name: How to use it
      ansible.builtin.debug:
        msg:
          - "export KUBECONFIG={{ secrets_dir | realpath }}/kubeconfig-oidc.yaml"
          - "kubectl auth whoami          # opens the Keycloak login in the browser the first time"
          - "kubectl -n spark-<you> get sparkapplications"
          - "Needs kubelogin: brew install int128/kubelogin/kubelogin"
