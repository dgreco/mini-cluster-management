# The example domain: a shop, its orders, customers and payments, and what
# the business reads of them. Its tables are in tables/retail.yaml.
#
#   make dataplatform-tables ARGS="load subsystems/dataplatform/metacatalog/domains/retail.yaml"
#
# A domain holds subdomains, a subdomain holds tables (table-model.yaml).
# Their names become part of every table's folder and schema name
# (lakehouse/<domain>/<subdomain>/..., <domain>_<subdomain>_<layer>):
# lower-case letters and digits, no '_'. Loading the file again adds the
# subdomains Meta Catalog does not have yet.
entityType: "DomainType"
values:
  name: "retail"
  description: "The shop: what it sells, to whom, and what it is paid"
  owner: "the data engineering team"
parts:
  - entityType: "SubdomainType"
    values: { name: "orders", description: "Orders as the web shop takes them" }
  - entityType: "SubdomainType"
    values: { name: "customers", description: "Who buys: the CRM's customers" }
  - entityType: "SubdomainType"
    values: { name: "payments", description: "What was paid, from the payments database" }
  - entityType: "SubdomainType"
    values: { name: "analytics", description: "What the business reads: revenue, customer value" }
