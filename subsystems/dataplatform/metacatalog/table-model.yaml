# The data model of the platform, in Meta Catalog's bulk format (traits,
# relationships, entity types, mappings). This file is the whole model, as
# Meta Catalog gets it: nothing is rendered into it. make dataplatform-tables
# ARGS=model sends what Meta Catalog lacks and versions what changed (it
# shows the calls and asks first); sync and load send it when Meta Catalog
# has none of it. Entities keep the version they were made with, so a new
# property or enum value is for tables made afterwards.
#
# Two kinds of thing (the platform's choice of 2026-11-22: domains are
# entities, a table's version is part of its name):
#
#   a domain   DomainType: a name and a description. It depends on every
#              table of the domain (DEPENDS_ON), so Meta Catalog's Assets
#              pages draw each domain over its tables. The links are kept by
#              make dataplatform-tables from the tables' `domain`.
#   a table    TableType, a versioned asset (the built-in Asset and
#              Versionable: Meta Catalog keeps every change of it as a
#              numbered version). What it says about itself: name,
#              description, domain (the name of its domain), layer (BRONZE,
#              SILVER, GOLD), format (parquet, iceberg) and version; its one
#              part, TableSchemaType, holds the columns (name, type,
#              description). Lineage: a table DEPENDS_ON the tables it is
#              built from. A table is the unit that is provisioned and the
#              subject of authorization (its root carries the access policy:
#              principals, permissions, grants).
#
# The version is part of a table's identity: v1 and v2 of a table are two
# tables, side by side, each with its own folder and its own entry in the
# metastore. The mappings derive the two physical resources of a table from
# domain, layer, name and version:
#
#   table  -> S3FolderType:  s3://dataplatform/lakehouse/<domain>/<layer>/<name>_v<version>
#   schema -> HiveTableType: lakehouse.<domain>_<layer>.<name>_v<version> (Trino),
#                            at that folder
#
# with the layer in lower case. A table's place, name, format and version
# never change: another one is another table.
#
# Both are handled by Meta Catalog's `script` task
# (gitops/manifests/governance/metacatalog/provisioning/table.sh), which
# builds every place again from the names, refuses values that say otherwise
# and a domain that is no DomainType of Meta Catalog. Provision makes the
# folder, then registers the table (the schema's mapping reaches the folder
# through its table, which is what puts the folder first; unprovision goes
# the other way round). Authorize turns the table's grants into rights where
# each resource is enforced: on the folder, Ceph's STS roles; on the table,
# Trino's rules in the Open Policy Agent. Reject withdraws them.
#
# Mapped values are plain strings: Meta Catalog's expressions call only
# JsonNode's methods (no toLowerCase), hence the conditional for the layer.
# dataplatform is the platform's bucket (site_bucket in
# inventory/group_vars/all/site.yml), written out in the mappings: on a site
# with another bucket, change it there before the first load. Names: a
# domain is lower-case letters and digits (no '_': <domain>_<layer> must name
# one schema), a table lower-case letters, digits and '_'. Everything ends up
# in SQL identifiers and S3 keys; the provisioning script checks them again.

Traits:
  # A domain: what it is called and what it holds.
  - name: Domain
    schema:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9]{0,23}$"
        description:
          type: string

  # A table. `domain` names the DomainType it belongs to (the mappings read
  # the name from here, never through the domain's link: a link a mapping
  # walks can never be removed).
  - name: Dataset
    schema:
      type: object
      required: [name, description, domain, layer, format, version]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,50}$"
        description:
          type: string
        domain:
          type: string
          pattern: "^[a-z][a-z0-9]{0,23}$"
        layer:
          type: string
          enum: [BRONZE, SILVER, GOLD]
        format:
          type: string
          enum: [parquet, iceberg]
        version:
          type: integer
          minimum: 1
          maximum: 999

  # A table's columns. Types as in the platform's model (string, long, int,
  # double, decimal(p,s), date, timestamp, boolean, ...): the provisioning
  # script maps them to Trino's and refuses what the format cannot hold.
  - name: Columns
    schema:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, type, description]
            properties:
              name:
                type: string
                pattern: "^[a-z_][a-z0-9_]{0,62}$"
              type:
                type: string
              description:
                type: string

---
Relationships:

  # A domain depends on each of its tables.
  - sourceTrait: Domain
    relationshipType: DEPENDS_ON
    targetTrait: Dataset

  # Lineage: a silver table depends on the bronze ones it is built from, a
  # gold one on silver ones (of any domain).
  - sourceTrait: Dataset
    relationshipType: DEPENDS_ON
    targetTrait: Dataset

---
EntityTypes:

  # The domain: an asset of its own, with no part and no resource, so that
  # the Assets pages list it and draw its dependencies on its tables.
  # Provisioning or authorizing it does nothing (make dataplatform-tables
  # never runs either on a domain).
  - name: DomainType
    schema:
      type: object
      properties: {}
    traits:
      - Asset
      - Domain

  # The table: the aggregate root, a versioned asset. Its principals,
  # permissions and grants are the one access policy of its folder and of
  # its entry in the metastore.
  - name: TableType
    schema:
      type: object
      properties: {}
    traits:
      - Asset
      - Versionable
      - Dataset

  # The table's schema, its one part (Aggregate as well as AggregateElement:
  # provisioning collects derived resources from the Aggregate carriers of
  # the tree only, so the metastore table of a pure leaf would never be
  # provisioned). A table without a schema is a folder of files only.
  - name: TableSchemaType
    schema:
      type: object
      properties: {}
    traits:
      - Aggregate
      - AggregateElement
      - Columns

  # The physical side, derived by the mappings below and never written by
  # hand. Mapped values are plain strings (`columns` is the schema's column
  # list as JSON text); `kind` tells the two apart, for the script and for a
  # grant that selects one of them (resources: {values: {kind: folder}}).
  - name: S3FolderType
    schema:
      type: object
      properties:
        kind:
          type: string
        bucket:
          type: string
        path:
          type: string
        location:
          type: string
        domain:
          type: string
        layer:
          type: string
        table:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

  - name: HiveTableType
    schema:
      type: object
      properties:
        kind:
          type: string
        catalog:
          type: string
        schema:
          type: string
        table:
          type: string
        format:
          type: string
        location:
          type: string
        schemaLocation:
          type: string
        columns:
          type: string
        domain:
          type: string
        layer:
          type: string
    traits:
      - ProvisionableResource
      - AuthorizableResource

---
Mappings:

  # Table -> its folder.
  - sourceEntityType: TableType
    targetEntityType: S3FolderType
    mappingValues:
      kind: "'folder'"
      bucket: "'dataplatform'"
      domain: "#source.getValue('$.domain').asText()"
      layer: >-
        #source.getValue('$.layer').asText() == 'BRONZE' ? 'bronze'
        : (#source.getValue('$.layer').asText() == 'SILVER' ? 'silver' : 'gold')
      table: "#source.getValue('$.name').asText() + '_v' + #source.getValue('$.version').asText()"
      path: >-
        'lakehouse/' + #source.getValue('$.domain').asText() + '/'
        + (#source.getValue('$.layer').asText() == 'BRONZE' ? 'bronze'
           : (#source.getValue('$.layer').asText() == 'SILVER' ? 'silver' : 'gold'))
        + '/' + #source.getValue('$.name').asText() + '_v' + #source.getValue('$.version').asText()
      location: >-
        's3://dataplatform/lakehouse/' + #source.getValue('$.domain').asText() + '/'
        + (#source.getValue('$.layer').asText() == 'BRONZE' ? 'bronze'
           : (#source.getValue('$.layer').asText() == 'SILVER' ? 'silver' : 'gold'))
        + '/' + #source.getValue('$.name').asText() + '_v' + #source.getValue('$.version').asText()
    entityPathReferences: []

  # Schema -> the table in the metastore. `table` walks up to the table the
  # schema is part of; `folder` goes on to the folder derived from it, so the
  # table is registered after its folder exists and dropped before it goes.
  - sourceEntityType: TableSchemaType
    targetEntityType: HiveTableType
    mappingValues:
      kind: "'table'"
      catalog: "'lakehouse'"
      domain: "#table.getValue('$.domain').asText()"
      layer: >-
        #table.getValue('$.layer').asText() == 'BRONZE' ? 'bronze'
        : (#table.getValue('$.layer').asText() == 'SILVER' ? 'silver' : 'gold')
      schema: >-
        #table.getValue('$.domain').asText() + '_'
        + (#table.getValue('$.layer').asText() == 'BRONZE' ? 'bronze'
           : (#table.getValue('$.layer').asText() == 'SILVER' ? 'silver' : 'gold'))
      table: "#table.getValue('$.name').asText() + '_v' + #table.getValue('$.version').asText()"
      format: "#table.getValue('$.format').asText()"
      location: "#folder.getValue('$.location').asText()"
      schemaLocation: >-
        's3://dataplatform/lakehouse/' + #table.getValue('$.domain').asText() + '/'
        + (#table.getValue('$.layer').asText() == 'BRONZE' ? 'bronze'
           : (#table.getValue('$.layer').asText() == 'SILVER' ? 'silver' : 'gold'))
      columns: "#source.getValue('$.columns').toString()"
    entityPathReferences:
      - alias: "table"
        referencePath: "HAS_PART{$}"
      - alias: "folder"
        referencePath: "HAS_PART{$}/MAPPED_TO{$}"
