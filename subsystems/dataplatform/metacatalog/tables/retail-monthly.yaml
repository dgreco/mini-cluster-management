# A table of the example domain retail (the model's trait DomainMember),
# added after the eight of retail.yaml: a file's tables are loaded together,
# so a table that comes later gets a file of its own. Load, build and grant:
#
#   make dataplatform-tables ARGS="-l admin load subsystems/dataplatform/metacatalog/tables/retail-monthly.yaml"
#   make dataplatform-tables ARGS="provision retail/analytics/gold/monthly_revenue"
#   make dataplatform-tables ARGS="authorize retail/analytics/gold/monthly_revenue"   # the admin group only
#
#   layer   table            format    data-engineers   data-analysts
#   gold    monthly_revenue  iceberg   read, write      read
#
# It is built from the silver tables orders and payments; `dependsOn` names
# tables of the same file only, so that lineage is a DEPENDS_ON link made in
# Meta Catalog after the load. Once loaded, the table lives in Meta Catalog:
# change it there, not here.
ref: "monthly_revenue"
entityType: "TableType"
values:
  name: "monthly_revenue"
  description: "Revenue per month: orders paid, their total and average"
  domain: "retail"
  subdomain: "analytics"
  layer: "gold"
  format: "iceberg"
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "data-analysts", type: "GROUP" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers"], permissions: ["READ", "WRITE"] }
    - { principals: ["data-analysts"], permissions: ["READ"] }
parts:
  - entityType: "TableSchemaType"
    values:
      primaryKey: ["month"]
      columns:
        - { name: "month", type: "date", description: "First day of the month" }
        - { name: "orders", type: "long", description: "Orders paid in the month" }
        - { name: "revenue", type: "decimal(12,2)", description: "Total paid" }
        - { name: "average_order", type: "decimal(10,2)", description: "Revenue divided by orders" }
