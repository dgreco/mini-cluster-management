# The smoke test's tables (make dataplatform-smoke-test; their domain smoke,
# of the model's trait DomainMember): Meta Catalog makes every table and grants every one, so
# the test writes and reads tables of its own instead of making any. Their
# policies are shaped for the checks, not for a real medallion:
#
#   bronze  eng_t      iceberg  data-engineers read and write, data-analysts read
#                               (Trino writes it, a Spark job reads it)
#   bronze  spark_t    iceberg  data-engineers read and write (a Spark job writes it)
#   bronze  avro_t     avro     data-engineers read and write
#   bronze  drop_zone  parquet  data-engineers read and write: no schema, so a folder
#                               and nothing in the metastore (the S3 checks' objects)
#   gold    ana_t      parquet  data-analysts read and write
#
# The smoke test loads and provisions them on every run, authorizes them as
# its temporary member of platform-admins, and takes them out of Meta Catalog
# again at the end. The groups are the site's engineer and analyst groups
# (site_engineer_group, site_analyst_group), written out: the test puts its
# users in those and stops at once when this file names others.
ref: "eng_t"
entityType: "TableType"
values:
  name: "eng_t"
  description: "Trino writes it, a Spark job reads it"
  domain: "smoke"
  subdomain: "test"
  layer: "bronze"
  format: "iceberg"
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "data-analysts", type: "GROUP" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers"], permissions: ["READ", "WRITE"] }
    - { principals: ["data-analysts"], permissions: ["READ"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "x", type: "int" }
---
ref: "spark_t"
entityType: "TableType"
values:
  name: "spark_t"
  description: "A Spark job writes it, Trino reads it"
  domain: "smoke"
  subdomain: "test"
  layer: "bronze"
  format: "iceberg"
  principals:
    - { id: "data-engineers", type: "GROUP" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "id", type: "long" }
---
ref: "avro_t"
entityType: "TableType"
values:
  name: "avro_t"
  description: "A table of plain files, through Trino"
  domain: "smoke"
  subdomain: "test"
  layer: "bronze"
  format: "avro"
  principals:
    - { id: "data-engineers", type: "GROUP" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "x", type: "int" }
        - { name: "at", type: "timestamp" }
---
ref: "drop_zone"
entityType: "TableType"
values:
  name: "drop_zone"
  description: "A folder with no table: files only"
  domain: "smoke"
  subdomain: "test"
  layer: "bronze"
  format: "parquet"
  principals:
    - { id: "data-engineers", type: "GROUP" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers"], permissions: ["READ", "WRITE"] }
---
ref: "ana_t"
entityType: "TableType"
dependsOn: ["eng_t"]
values:
  name: "ana_t"
  description: "The analysts own"
  domain: "smoke"
  subdomain: "test"
  layer: "gold"
  format: "parquet"
  principals:
    - { id: "data-analysts", type: "GROUP" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-analysts"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "y", type: "int" }
