ref: "logistics_silver_shipments_v1"
entityType: "TableType"
dependsOn: ["logistics_bronze_shipments_v1", "logistics_bronze_carriers_v1"]
values:
  name: "shipments"
  description: "One row per parcel with its carrier's name and service level, transit time and whether it came on time"
  domain: "logistics"
  layer: "SILVER"
  format: "iceberg"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "shipment_id", type: "long", description: "The parcel's tracking number" }
        - { name: "order_id", type: "long", description: "The order it carries" }
        - { name: "carrier_code", type: "string", description: "Who carries it" }
        - { name: "carrier_name", type: "string", description: "The carrier's name" }
        - { name: "service_level", type: "string", description: "economy, standard or express" }
        - { name: "warehouse", type: "string", description: "Where it left from" }
        - { name: "shipped_date", type: "date", description: "Day it left the warehouse (UTC)" }
        - { name: "shipped_ts", type: "timestamp", description: "When it left the warehouse (UTC)" }
        - { name: "delivered_ts", type: "timestamp", description: "When it was delivered (UTC), if it was" }
        - { name: "transit_hours", type: "double", description: "Hours from the warehouse to the door, if delivered" }
        - { name: "promised_hours", type: "int", description: "Hours the carrier's service level promises" }
