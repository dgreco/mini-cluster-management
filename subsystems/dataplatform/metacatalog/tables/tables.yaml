  layer: "SILVER"
  format: "iceberg"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "customer_id", type: "long", description: "The customer's number" }
        - { name: "full_name", type: "string", description: "First and last name" }
        - { name: "email", type: "string", description: "E-mail address, lower case" }
        - { name: "email_domain", type: "string", description: "The part of the address after @" }
        - { name: "country", type: "string", description: "ISO 3166 country code, upper case" }
        - { name: "segment", type: "string", description: "consumer, smb or enterprise" }
        - { name: "signup_date", type: "date", description: "Day the customer signed up" }
