ref: "sales_silver_orders_v1"
entityType: "TableType"
dependsOn: ["sales_bronze_orders_v1"]
values:
  name: "orders"
  description: "One row per order in its latest status, broken events left out, totals in EUR"
  domain: "sales"
  layer: "SILVER"
  format: "iceberg"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "order_id", type: "long", description: "The order's number" }
        - { name: "customer_id", type: "long", description: "Who ordered" }
        - { name: "order_date", type: "date", description: "Day the order was placed (UTC)" }
        - { name: "order_ts", type: "timestamp", description: "When the order was placed (UTC)" }
        - { name: "status", type: "string", description: "The order's latest status" }
        - { name: "currency", type: "string", description: "Currency the customer paid in" }
        - { name: "amount", type: "decimal(12,2)", description: "Order total in its currency" }
        - { name: "amount_eur", type: "decimal(12,2)", description: "Order total in EUR (fixed rates of the example)" }
        - { name: "items", type: "int", description: "Number of items" }
        - { name: "channel", type: "string", description: "web, app, store or marketplace" }
