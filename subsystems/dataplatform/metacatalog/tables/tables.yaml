ref: "logistics_gold_delivery_performance_v1"
entityType: "TableType"
dependsOn: ["logistics_silver_shipments_v1", "sales_silver_orders_v1", "sales_silver_customers_v1"]
values:
  name: "delivery_performance"
  description: "How each carrier and service level delivers, per day and destination country: on-time rate and transit times"
  domain: "logistics"
  layer: "GOLD"
  format: "iceberg"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "data-analysts", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
    - { principals: ["data-analysts"], permissions: ["READ"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "shipped_date", type: "date", description: "Day the parcels left (UTC)" }
        - { name: "carrier_name", type: "string", description: "The carrier" }
        - { name: "service_level", type: "string", description: "economy, standard or express" }
        - { name: "destination_country", type: "string", description: "The customers' country" }
        - { name: "shipments", type: "long", description: "Parcels shipped" }
        - { name: "delivered", type: "long", description: "Parcels delivered" }
        - { name: "on_time", type: "long", description: "Parcels delivered within the promised hours" }
        - { name: "on_time_rate", type: "double", description: "on_time / delivered" }
        - { name: "avg_transit_hours", type: "double", description: "Average hours to the door" }
        - { name: "p95_transit_hours", type: "double", description: "95th percentile of the hours to the door" }
