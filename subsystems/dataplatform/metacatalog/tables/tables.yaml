# The platform's domains and tables: this file is their one definition.
# Every domain and table of Meta Catalog but the smoke test's (smoke, smoke*)
# is what this file says:
#
#   make dataplatform-tables ARGS="-n sync"        # what sync would do, changing nothing
#   make dataplatform-tables ARGS="-l admin sync"  # do it (shows it and asks; ARGS="-y ..." does not)
#
# sync makes what is new here, gives a table whose description, columns,
# lineage or grants changed here those of this file (one new version of it
# in Meta Catalog), keeps every domain depending on exactly its own tables,
# provisions and authorizes every table (rejects one with no grant), and
# REMOVES what is no longer here: a table is rejected, unprovisioned (DROPPED,
# its files DELETED) and deleted, then a domain with no table left.
# Authorizing needs the admin group (-l admin; the login is kept an hour).
#
# Each document is a domain (DomainType: name, description) or a table
# (TableType). A table names its domain (`domain`), its layer (BRONZE,
# SILVER, GOLD), its format (parquet, iceberg) and its version, which with
# its name identify it: a new version is a new table next to the old one
# (copy the document, change `ref` and `version` together). The old version
# stays as long as its document stays here: take it out and sync drops it,
# with its data. The pipelines (examples/lakehouse/dags) use the highest
# version of each table here. `dependsOn` is its lineage: the `ref` of the
# tables it is built from. A table without parts is a folder of files only
# (no table in the metastore). A domain's dependencies on its tables are not
# written here: sync derives them from the tables' `domain`.
#
# Who owns what (READ: query the table, read its files; WRITE: also change
# its rows and write its files; nobody but Meta Catalog makes, alters or
# drops a table, and the admin group reads and writes every table anyway):
#
#   layer   data-engineers   data-analysts   lakehouse-pipeline (SERVICE)
#   BRONZE  read, write      -               read, write
#   SILVER  read, write      -               read, write
#   GOLD    read, write      read            read, write
#
# lakehouse-pipeline is the Keycloak client whose service account
# (service-account-lakehouse-pipeline) Airflow's DAGs run as. The groups are
# the site's (inventory/group_vars/all/site.yml), written out as they are
# in the directory.
#
#   domain     layer   table                    format   built from
#   sales      BRONZE  customers_v1             parquet  (the generator: examples/lakehouse)
#   sales      BRONZE  orders_v1                parquet  (the generator)
#   sales      SILVER  customers_v1             iceberg  bronze customers
#   sales      SILVER  orders_v1                iceberg  bronze orders
#   sales      GOLD    daily_sales_v1           iceberg  silver orders, customers
#   sales      GOLD    customer_value_v1        iceberg  silver orders, customers
#   logistics  BRONZE  carriers_v1              parquet  (the generator)
#   logistics  BRONZE  shipments_v1             parquet  (the generator)
#   logistics  SILVER  shipments_v1             iceberg  bronze shipments, carriers
#   logistics  GOLD    delivery_performance_v1  iceberg  silver shipments; sales silver orders, customers
ref: "sales"
entityType: "DomainType"
values:
  name: "sales"
  description: "The web shop's customers and orders: who buys what, through which channel, for how much"
---
ref: "logistics"
entityType: "DomainType"
values:
  name: "logistics"
  description: "Getting the orders to the customers: carriers, shipments and how well they deliver"
---
ref: "sales_bronze_customers_v1"
entityType: "TableType"
values:
  name: "customers"
  description: "The CRM's customer export, as it came: names and countries as typed, one row per customer"
  domain: "sales"
  layer: "BRONZE"
  format: "parquet"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "customer_id", type: "long", description: "The customer's number in the CRM" }
        - { name: "full_name", type: "string", description: "First and last name, as typed" }
        - { name: "email", type: "string", description: "E-mail address, mixed case" }
        - { name: "country", type: "string", description: "ISO 3166 country code, in either case" }
        - { name: "segment", type: "string", description: "consumer, smb or enterprise" }
        - { name: "signup_date", type: "date", description: "Day the customer signed up" }
        - { name: "ingested_at", type: "timestamp", description: "When the export was loaded" }
---
ref: "sales_bronze_orders_v1"
entityType: "TableType"
values:
  name: "orders"
  description: "Order events from the web shop, as emitted: a status change repeats the order, some rows are broken"
  domain: "sales"
  layer: "BRONZE"
  format: "parquet"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "order_id", type: "long", description: "The order's number" }
        - { name: "customer_id", type: "long", description: "Who ordered (missing on a few broken events)" }
        - { name: "order_ts", type: "timestamp", description: "When the order was placed (UTC)" }
        - { name: "status", type: "string", description: "placed, paid, shipped, delivered, cancelled or returned" }
        - { name: "currency", type: "string", description: "EUR, USD, GBP or CHF" }
        - { name: "amount", type: "double", description: "Order total in its currency (zero or negative on broken events)" }
        - { name: "items", type: "int", description: "Number of items" }
        - { name: "channel", type: "string", description: "web, app, store or marketplace" }
        - { name: "ingested_at", type: "timestamp", description: "When the event was loaded" }
---
ref: "logistics_bronze_carriers_v1"
entityType: "TableType"
values:
  name: "carriers"
  description: "The carriers the shop ships with and their service levels, from the carrier contracts"
  domain: "logistics"
  layer: "BRONZE"
  format: "parquet"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "carrier_code", type: "string", description: "Short code of the carrier" }
        - { name: "carrier_name", type: "string", description: "The carrier's name" }
        - { name: "service_level", type: "string", description: "economy, standard or express" }
        - { name: "home_country", type: "string", description: "ISO 3166 code of the carrier's home market" }
        - { name: "promised_hours", type: "int", description: "Delivery time the contract promises, in hours" }
        - { name: "ingested_at", type: "timestamp", description: "When the contract list was loaded" }
---
ref: "logistics_bronze_shipments_v1"
entityType: "TableType"
values:
  name: "shipments"
  description: "Shipment tracking events from the warehouses: one row per parcel, as the tracking feed reports it"
  domain: "logistics"
  layer: "BRONZE"
  format: "parquet"
  version: 1
  principals:
    - { id: "data-engineers", type: "GROUP" }
    - { id: "lakehouse-pipeline", type: "SERVICE" }
  permissions:
    - { name: "READ", description: "Query the table, read its files" }
    - { name: "WRITE", description: "Change its rows, write its files" }
  grants:
    - { principals: ["data-engineers", "lakehouse-pipeline"], permissions: ["READ", "WRITE"] }
parts:
  - entityType: "TableSchemaType"
    values:
      columns:
        - { name: "shipment_id", type: "long", description: "The parcel's tracking number" }
        - { name: "order_id", type: "long", description: "The order it carries" }
        - { name: "carrier_code", type: "string", description: "Who carries it" }
        - { name: "warehouse", type: "string", description: "Where it left from" }
        - { name: "shipped_ts", type: "timestamp", description: "When it left the warehouse (UTC)" }
        - { name: "delivered_ts", type: "timestamp", description: "When it was delivered (UTC); empty while under way" }
        - { name: "status", type: "string", description: "in_transit, delivered, returned or lost" }
        - { name: "weight_kg", type: "double", description: "Parcel weight in kilograms" }
        - { name: "ingested_at", type: "timestamp", description: "When the event was loaded" }
---
