---
# The administrative logins of the platform. Everyday logins go through
# Keycloak (realm {{ dataplatform_keycloak_realm }}); these are the bootstrap
# and break-glass accounts.
- name: Data platform logins
  hosts: "{{ groups['k3s_servers'][0] }}"
  gather_facts: false
  tasks:
    - name: Argo CD initial admin password
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl -n argocd get secret argocd-initial-admin-secret -o 'jsonpath={.data.password}'
      register: passwords_argocd
      changed_when: false
      failed_when: false
      no_log: true

    - name: OpenBao client
      ansible.builtin.include_role:
        name: dataplatform_openbao
        tasks_from: client

    - name: Logins stored in OpenBao
      ansible.builtin.uri:
        url: "{{ dataplatform_openbao_addr }}/v1/secret/data/dataplatform/{{ item }}"
        headers: {X-Vault-Token: "{{ dataplatform_openbao_token }}"}
        status_code: [200, 404]
      loop: [governance/platform-admin, governance/keycloak-admin, observability/grafana-admin, governance/samba-ad]
      register: passwords_openbao
      no_log: true

    - name: Logins
      ansible.builtin.debug:
        msg:
          - "YOUR LOGIN (the first user of the directory, in {{ dataplatform_iam_admin_groups | first }}): user
             {{ _kv['governance/platform-admin'].username | default('-') }}, password
             {{ _kv['governance/platform-admin'].password | default('-') }} (as the directory was seeded with it: one set
             since, in LDAP Account Manager or with make dataplatform-directory ARGS='user passwd ...', is not shown here)"
          - "  use it on every web UI: Trino, Grafana 'Sign in with Keycloak', Argo CD 'Log in via Keycloak', OpenBao method OIDC,
             {{ dataplatform_keycloak_url }}/admin/{{ dataplatform_keycloak_realm }}/console/ (the realm's clients and sessions)"
          - "  users and groups: {{ dataplatform_directory_ui_url }} (LDAP Account Manager: the same login, twice) or
             make dataplatform-directory; they are kept in the directory (Samba AD), which Keycloak only reads"
          - "Break-glass accounts, not Keycloak (only on each tool's own login form):"
          - "  Keycloak master realm (not served by the Gateway; Ansible logs in as the client ansible, the bootstrap admin
             below is deleted by make dataplatform-iam; break-glass: subsystems/dataplatform/README.md, Secrets):
             {{ _kv['governance/keycloak-admin'].username | default('-') }} / {{ _kv['governance/keycloak-admin'].password | default('-') }}"
          - "  Argo CD local account (off; admin.enabled in gitops/bootstrap/argocd-values.yaml turns it on): admin /
             {{ (passwords_argocd.stdout | b64decode) if passwords_argocd.rc == 0 else '- (initial secret deleted)' }}"
          - "  Grafana local account (the username/password form):
             {{ _kv['observability/grafana-admin']['admin-user'] | default('-') }} / {{ _kv['observability/grafana-admin']['admin-password'] | default('-') }}"
          - "  The directory's own Administrator (Samba AD, in the pod {{ dataplatform_directory_pod }} only; adctl needs no login):
             Administrator / {{ _kv['governance/samba-ad']['admin-password'] | default('-') }}"
          - "  OpenBao root token (method Token): root_token in {{ dataplatform_openbao_init_file }} (break-glass only)"
      vars:
        _kv: >-
          {{ dict(passwords_openbao.results | map(attribute='item')
                  | zip(passwords_openbao.results | map(attribute='json') | map('default', {}) | map(attribute='data', default={})
                        | map(attribute='data', default={}))) }}
