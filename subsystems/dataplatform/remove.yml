---
# REMOVE the data platform: every Argo CD Application and what it created
# (databases, OpenBao and its secrets, Keycloak and its realm, metrics and
# logs: their volumes are deleted), Argo CD itself, the certificate timer and
# the servicelb node labels.
#   make dataplatform-remove ARGS="-e remove_confirm=yes"
#   ... -e remove_ceph_data=true   also the S3 side: every bucket of the
#                                   platform with its data, the group roles,
#                                   the OIDC provider and the service users
# The public DNS records and the k3s OIDC login settings stay.
- name: Remove the data platform
  hosts: "{{ groups['k3s_servers'][0] }}"
  gather_facts: false
  vars:
    remove_confirm: "no"
    remove_ceph_data: false
    remove_timeout: 900
  tasks:
    - name: Confirmation
      ansible.builtin.assert:
        that: remove_confirm == 'yes'
        fail_msg: "This deletes the data platform and its data. Run with -e remove_confirm=yes."
        quiet: true

    # The root application's finalizer deletes every child Application, whose
    # finalizers delete their resources.
    - name: Delete the root application and everything it created
      ansible.builtin.shell: |
        set -o pipefail
        k="/usr/local/bin/k3s kubectl"
        # An admission webhook whose Service is gone (the namespace of its operator
        # was deleted first) can only fail, and blocks the deletion of every
        # object it validates, namespaces included: delete it.
        dead_webhooks() {
          local kind name ns svc
          for kind in validatingwebhookconfiguration mutatingwebhookconfiguration; do
            w=.webhooks[0].clientConfig.service
            $k get "$kind" -o jsonpath="{range .items[*]}{.metadata.name} {$w.namespace} {$w.name}{\"\\n\"}{end}" |
            while read -r name ns svc; do
              [ -n "$svc" ] || continue
              $k -n "$ns" get service "$svc" >/dev/null 2>&1 || $k delete "$kind" "$name" --ignore-not-found
            done
          done
        }
        $k -n argocd delete application dataplatform --ignore-not-found --wait=false
        end=$((SECONDS + {{ remove_timeout }}))
        while [ -n "$($k -n argocd get applications -o name 2>/dev/null)" ]; do
          dead_webhooks
          if [ $SECONDS -ge $end ]; then
            echo "still there, finalizers removed: $($k -n argocd get applications -o name | tr '\n' ' ')"
            for a in $($k -n argocd get applications -o name); do
              $k -n argocd patch "$a" --type merge -p '{"metadata":{"finalizers":[]}}'
            done
            break
          fi
          sleep 10
        done
      args:
        executable: /bin/bash
      register: remove_apps
      changed_when: true

    - name: Namespaces of the platform
      ansible.builtin.shell: |
        set -o pipefail
        k="/usr/local/bin/k3s kubectl"
        # An admission webhook whose Service is gone (the namespace of its operator
        # was deleted first) can only fail, and blocks the deletion of every
        # object it validates, namespaces included: delete it.
        dead_webhooks() {
          local kind name ns svc
          for kind in validatingwebhookconfiguration mutatingwebhookconfiguration; do
            w=.webhooks[0].clientConfig.service
            $k get "$kind" -o jsonpath="{range .items[*]}{.metadata.name} {$w.namespace} {$w.name}{\"\\n\"}{end}" |
            while read -r name ns svc; do
              [ -n "$svc" ] || continue
              $k -n "$ns" get service "$svc" >/dev/null 2>&1 || $k delete "$kind" "$name" --ignore-not-found
            done
          done
        }
        nss="operators nginx-gateway core governance compute observability tools"
        # Once operators is gone, no controller is left to run the finalizers
        # of the objects still in a terminating namespace (the cleanup of the
        # ExternalSecrets, of a database cluster): clear the finalizers of the kinds the
        # namespace reports, or it stays Terminating for ever.
        orphan_finalizers() {
          local ns r cond
          $k get namespace operators >/dev/null 2>&1 && return 0
          cond='{.status.conditions[?(@.type=="NamespaceFinalizersRemaining")].message}'
          for ns in $nss; do
            for r in $($k get namespace "$ns" -o jsonpath="$cond" 2>/dev/null | grep -oE '[a-z0-9.-]+/[^ ,]+ in' | sed 's|/.*||' | sort -u); do
              $k -n "$ns" get "$r" -o name | xargs -r -I{} $k -n "$ns" patch {} --type merge -p '{"metadata":{"finalizers":null}}'
            done
          done
        }
        $k delete namespace --ignore-not-found --wait=false $nss
        end=$((SECONDS + {{ remove_timeout }}))
        for ns in $nss; do
          while $k get namespace "$ns" >/dev/null 2>&1; do
            dead_webhooks
            orphan_finalizers
            [ $SECONDS -ge $end ] && { echo "namespace $ns still terminating"; break; }
            sleep 5
          done
        done
      args:
        executable: /bin/bash
      changed_when: true

    - name: Argo CD (k3s HelmChart), its namespace and CRDs
      ansible.builtin.shell: |
        set -o pipefail
        k="/usr/local/bin/k3s kubectl"
        rm -f /var/lib/rancher/k3s/server/manifests/dataplatform-argocd.yaml
        $k -n kube-system delete helmchart argo-cd --ignore-not-found --wait=true --timeout=300s
        $k delete namespace argocd --ignore-not-found --wait=true --timeout=300s
        # no match on a second run: the status of grep must not fail the pipeline
        $k get crd -o name | { grep -E 'argoproj\.io' || true; } | xargs -r $k delete --ignore-not-found
      args:
        executable: /bin/bash
      changed_when: true

    - name: Stop the certificate renewal timer
      ansible.builtin.systemd:
        name: dataplatform-cert.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: Certificate renewal programs, units, lego account and certificate
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/dataplatform-cert.service
        - /etc/systemd/system/dataplatform-cert.timer
        - /usr/local/sbin/dataplatform-cert
        - /usr/local/sbin/dataplatform-cert-deploy
        - /etc/dataplatform

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # The servicelb node labels stay: without them k3s would publish a later
    # LoadBalancer Service on every node, the Ceph ingress hosts included
    # (make dataplatform-edge sets them again anyway).

    # OpenBao's storage is gone: its recovery keys and root token are useless
    # now, but kept aside (the next install refuses to run with the old file).
    - name: Keep the old OpenBao initialisation aside
      ansible.builtin.command: >-
        mv {{ dataplatform_openbao_init_file }} {{ dataplatform_openbao_init_file }}.removed-{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}
      args:
        removes: "{{ dataplatform_openbao_init_file }}"
      delegate_to: localhost
      become: false

- name: Remove the S3 side of the platform
  hosts: "{{ groups['ceph_mons'][0] }}"
  gather_facts: false
  vars:
    remove_confirm: "no"
    remove_ceph_data: false
  tasks:
    - name: S3 data, roles, provider and users
      when: remove_confirm == 'yes' and remove_ceph_data | bool
      block:
        - name: Roles of the platform (the account's)
          ansible.builtin.shell: |
            set -o pipefail
            cephadm shell -- radosgw-admin role list --account-id={{ dataplatform_rgw_account_id }} 2>/dev/null \
              | python3 -c 'import json,sys; print("\n".join(r["RoleName"] for r in json.load(sys.stdin)))' || true
          args:
            executable: /bin/bash
          register: remove_roles
          changed_when: false

        - name: Delete the roles
          ansible.builtin.command: >-
            cephadm shell -- sh -c 'A={{ dataplatform_rgw_account_id }};
            radosgw-admin role-policy delete --role-name={{ item }} --policy-name=access --account-id=$A;
            radosgw-admin role delete --role-name={{ item }} --account-id=$A'
          loop: "{{ remove_roles.stdout_lines | select | list }}"
          changed_when: true
          failed_when: false

        # radosgw-admin has no OIDC provider commands (Squid): they go through
        # the IAM API, as a root user of the account, a temporary one (the
        # platform's own may be gone already, after a run that stopped later)
        - name: The account
          ansible.builtin.command: cephadm shell -- radosgw-admin account get --account-id={{ dataplatform_rgw_account_id }}
          register: remove_account_info
          changed_when: false
          failed_when: false

        - name: A temporary root user of the account
          ansible.builtin.command: >-
            cephadm shell -- sh -c 'radosgw-admin user info --uid=dataplatform-remove 2>/dev/null
            || radosgw-admin user create --uid=dataplatform-remove --display-name=dataplatform-remove
            --account-id={{ dataplatform_rgw_account_id }} --account-root'
          register: remove_tmp_user
          when: remove_account_info.rc == 0
          changed_when: true
          no_log: true

        - name: Delete the OIDC providers of the account
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - -c
              - |
                import os, boto3
                iam = boto3.client("iam", endpoint_url=os.environ["IAM_ENDPOINT"], region_name=os.environ["IAM_REGION"])
                for p in iam.list_open_id_connect_providers()["OpenIDConnectProviderList"]:
                    iam.delete_open_id_connect_provider(OpenIDConnectProviderArn=p["Arn"])
                    print("deleted", p["Arn"])
          environment:
            IAM_ENDPOINT: "{{ dataplatform_s3_endpoint }}"
            IAM_REGION: "{{ dataplatform_s3_region }}"
            AWS_ACCESS_KEY_ID: "{{ (remove_tmp_user.stdout | from_json)['keys'][0]['access_key'] }}"
            AWS_SECRET_ACCESS_KEY: "{{ (remove_tmp_user.stdout | from_json)['keys'][0]['secret_key'] }}"
          delegate_to: localhost
          become: false
          register: remove_oidc
          when: remove_account_info.rc == 0
          changed_when: "'deleted' in remove_oidc.stdout"
          no_log: true                         # the key is in the environment

        # The account owns its buckets (not a user): user rm --purge-data
        # leaves them, and account rm refuses an account that still has one.
        - name: Buckets of the account
          ansible.builtin.command: cephadm shell -- radosgw-admin bucket stats
          register: remove_buckets
          changed_when: false

        - name: Delete them with their objects
          ansible.builtin.command: cephadm shell -- radosgw-admin bucket rm --bucket={{ item }} --purge-objects
          loop: >-
            {{ remove_buckets.stdout | from_json | selectattr('owner', 'equalto', dataplatform_rgw_account_id)
               | map(attribute='bucket') | list }}
          changed_when: true

        - name: Delete the service users and the temporary root user
          ansible.builtin.command: cephadm shell -- radosgw-admin user rm --uid={{ item }} --purge-data
          loop: "{{ dataplatform_s3_users | map(attribute='uid') | list + ['dataplatform-remove'] }}"
          register: remove_users
          changed_when: remove_users.rc == 0
          failed_when: remove_users.rc != 0 and 'does not exist' not in remove_users.stderr

        - name: Delete the account
          ansible.builtin.command: cephadm shell -- radosgw-admin account rm --account-id={{ dataplatform_rgw_account_id }}
          register: remove_account
          changed_when: remove_account.rc == 0
          failed_when: remove_account.rc != 0 and 'No such file' not in remove_account.stderr   # gone already

    - name: What is left
      ansible.builtin.debug:
        msg: >-
          {{ 'The RGW account of the platform, its users, bucket (with its data), roles and OIDC provider were removed.'
             if remove_ceph_data | bool else
             'The RGW account with its users, bucket (and its data), roles and OIDC provider was kept: '
             ~ 'make dataplatform-remove ARGS="-e remove_confirm=yes -e remove_ceph_data=true" removes them. '
             ~ 'make dataplatform-install reuses them.' }}
      when: remove_confirm == 'yes'
