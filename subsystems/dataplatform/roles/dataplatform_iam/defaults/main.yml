---
# The realm's settings and clients, as the Keycloak operator imports them (single definition)
dataplatform_iam_realm_file: "{{ dataplatform_gitops_dir }}/manifests/governance/keycloak-realm/realm-import.yaml"
# The issuer without its scheme: RGW's name for the provider and the prefix of
# its condition keys (<idp>:groups, <idp>:sub, ...).
dataplatform_iam_idp: "{{ dataplatform_keycloak_issuer | regex_replace('^https?://', '') }}"
dataplatform_iam_provider_arn: "arn:aws:iam::{{ dataplatform_rgw_account_id }}:oidc-provider/{{ dataplatform_iam_idp }}"
# RGW IAM calls go through the S3 administrator created by subsystems/ceph
dataplatform_iam_s3admin: "{{ lookup('ansible.builtin.file', secrets_dir ~ '/s3-' ~ ceph_rgw_admin_uid ~ '.json') | from_json }}"
# Keycloak groups become RGW roles and buckets only if their name is usable in both
dataplatform_iam_group_pattern: '^[a-z0-9][a-z0-9-]{0,40}[a-z0-9]$'
# The master realm: Ansible's own confidential client (service account with
# the realm role admin), made with the bootstrap admin the first time; that
# temporary admin is then deleted (Keycloak nags about it until it is)
dataplatform_iam_kc_client: ansible
dataplatform_iam_delete_temp_admin: true
# The realm's user federation: Keycloak reads people and groups from the
# directory (Samba AD, group_vars dataplatform_directory_*), read-only.
# tasks/keycloak_federation.yml makes and keeps it; values go to the admin
# API as strings.
dataplatform_iam_federation_config:
  enabled: "true"
  priority: "0"
  vendor: ad
  connectionUrl: "{{ dataplatform_directory_url }}"
  useTruststoreSpi: always          # the directory's own certificate authority, in Keycloak's truststore
  startTls: "false"
  authType: simple
  bindDn: "CN={{ dataplatform_directory_bind_user }},OU={{ dataplatform_directory_services_ou }},{{ dataplatform_directory_base_dn }}"
  # one level under the people's unit: nothing else of the domain is a user here
  usersDn: "OU={{ dataplatform_directory_people_ou }},{{ dataplatform_directory_base_dn }}"
  searchScope: "1"
  usernameLDAPAttribute: sAMAccountName
  rdnLDAPAttribute: cn
  uuidLDAPAttribute: objectGUID
  userObjectClasses: person, organizationalPerson, user
  editMode: READ_ONLY
  importEnabled: "true"
  syncRegistrations: "false"
  trustEmail: "true"
  connectionPooling: "true"
  pagination: "true"
  # a domain controller that does not answer fails a login in seconds
  connectionTimeout: "5000"
  readTimeout: "10000"
  changedSyncPeriod: "{{ dataplatform_directory_changed_sync_period }}"
  fullSyncPeriod: "{{ dataplatform_directory_full_sync_period }}"
  batchSizeForSync: "1000"
  # a user's groups are cached with the user: a change in the directory
  # reaches the next token within this time (ms)
  cachePolicy: MAX_LIFESPAN
  maxLifespan: "{{ dataplatform_directory_cache_lifespan | int * 1000 }}"
  validatePasswordPolicy: "false"
  allowKerberosAuthentication: "false"
  useKerberosForPasswordAuthentication: "false"
  usePasswordModifyExtendedOp: "false"
# Its mappers, by name: the whole list (any other mapper is deleted).
# groups: mode LDAP_ONLY keeps memberships in the directory alone (Keycloak
# cannot add one: the bind account writes nothing); groups the directory does
# not have are dropped from the realm at every sync.
dataplatform_iam_federation_mappers:
  username:
    providerId: user-attribute-ldap-mapper
    config: {ldap.attribute: sAMAccountName, user.model.attribute: username, read.only: "true",
             always.read.value.from.ldap: "false", is.mandatory.in.ldap: "true"}
  email:
    providerId: user-attribute-ldap-mapper
    config: {ldap.attribute: mail, user.model.attribute: email, read.only: "true",
             always.read.value.from.ldap: "false", is.mandatory.in.ldap: "false"}
  first name:
    providerId: user-attribute-ldap-mapper
    config: {ldap.attribute: givenName, user.model.attribute: firstName, read.only: "true",
             always.read.value.from.ldap: "false", is.mandatory.in.ldap: "false"}
  last name:
    providerId: user-attribute-ldap-mapper
    config: {ldap.attribute: sn, user.model.attribute: lastName, read.only: "true",
             always.read.value.from.ldap: "false", is.mandatory.in.ldap: "false"}
  creation date:
    providerId: user-attribute-ldap-mapper
    config: {ldap.attribute: whenCreated, user.model.attribute: createTimestamp, read.only: "true",
             always.read.value.from.ldap: "false", is.mandatory.in.ldap: "false"}
  modify date:
    providerId: user-attribute-ldap-mapper
    config: {ldap.attribute: whenChanged, user.model.attribute: modifyTimestamp, read.only: "true",
             always.read.value.from.ldap: "false", is.mandatory.in.ldap: "false"}
  # a disabled account of the directory is a disabled user here
  MSAD account controls:
    providerId: msad-user-account-control-mapper
    config: {}
  groups:
    providerId: group-ldap-mapper
    config:
      groups.dn: "OU={{ dataplatform_directory_groups_ou }},{{ dataplatform_directory_base_dn }}"
      group.name.ldap.attribute: cn
      group.object.classes: group
      preserve.group.inheritance: "false"
      ignore.missing.groups: "true"
      membership.ldap.attribute: member
      membership.attribute.type: DN
      membership.user.ldap.attribute: sAMAccountName
      memberof.ldap.attribute: memberOf
      mode: LDAP_ONLY
      user.roles.retrieve.strategy: LOAD_GROUPS_BY_MEMBER_ATTRIBUTE
      drop.non.existing.groups.during.sync: "true"
      groups.path: /
# Keycloak's own test of the bind, with the password it holds (the mask)
dataplatform_iam_fed_test:
  action: testAuthentication
  connectionUrl: "{{ dataplatform_iam_federation_config.connectionUrl }}"
  bindDn: "{{ dataplatform_iam_federation_config.bindDn }}"
  bindCredential: "**********"
  useTruststoreSpi: "{{ dataplatform_iam_federation_config.useTruststoreSpi }}"
  connectionTimeout: "{{ dataplatform_iam_federation_config.connectionTimeout }}"
  startTls: "{{ dataplatform_iam_federation_config.startTls }}"
  authType: "{{ dataplatform_iam_federation_config.authType }}"
  componentId: "{{ dataplatform_iam_fed_id }}"
# -e dataplatform_iam_adopt_directory=true: users the realm holds itself are
# deleted there when the directory has them under the same name (the cut-over
# of a realm that had its own users)
dataplatform_iam_adopt_directory: false
# Client roles the admin groups get in the realm (added, never removed):
# they administer it in their own console
dataplatform_iam_admin_client_roles:
  realm-management: [realm-admin]
# Keycloak's Service, for the admin API calls made inside the cluster
dataplatform_iam_keycloak_namespace: governance
dataplatform_iam_keycloak_service: keycloak-service
# How long to wait for Keycloak to serve the realm (s)
dataplatform_iam_keycloak_timeout: 1200
# -e dataplatform_iam_prune=true: delete the RGW role, the empty bucket and
# the catalog role of a group that no longer exists in Keycloak
dataplatform_iam_prune: false
# OpenBao: the Keycloak group whose members get its admin policy
dataplatform_iam_openbao_admin_group: "{{ dataplatform_iam_admin_groups | first }}"
# The Iceberg catalog database (CloudNativePG) and its row-level security
dataplatform_iam_catalog_namespace: governance
dataplatform_iam_catalog_cluster: iceberg-catalog
dataplatform_iam_catalog_database: iceberg
dataplatform_iam_catalog_sql: "{{ dataplatform_gitops_dir }}/manifests/governance/iceberg-catalog/catalog-security.sql"
# OpenBao path (under secret/dataplatform/) with one key per group: the password of its catalog role
# OpenBao paths of the catalog logins whose password make dataplatform-iam
# sets (made by make dataplatform-openbao): the Spark jobs'
dataplatform_iam_catalog_logins: [governance/iceberg-catalog-spark]
