---
# Client roles of one service-account user of realm-import.yaml
# (dataplatform_iam_sa): add the missing ones.
- name: Service account of {{ dataplatform_iam_sa.serviceAccountClientId }}
  ansible.builtin.uri:
    url: "{{ dataplatform_iam_kc_api }}/clients?clientId={{ dataplatform_iam_sa.serviceAccountClientId | urlencode }}&search=false"
    headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
  delegate_to: "{{ dataplatform_iam_kc_host }}"
  register: dataplatform_iam_sa_client
  no_log: true   # a client representation carries the client secret

- name: Its user
  ansible.builtin.uri:
    url: "{{ dataplatform_iam_kc_api }}/clients/{{ dataplatform_iam_sa_client.json[0].id }}/service-account-user"
    headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
  delegate_to: "{{ dataplatform_iam_kc_host }}"
  register: dataplatform_iam_sa_user

- name: Clients that own the roles
  ansible.builtin.uri:
    url: "{{ dataplatform_iam_kc_api }}/clients?clientId={{ item | urlencode }}&search=false"
    headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
  loop: "{{ (dataplatform_iam_sa.clientRoles | default({})).keys() | list }}"
  delegate_to: "{{ dataplatform_iam_kc_host }}"
  register: dataplatform_iam_sa_role_clients
  no_log: true   # a client representation carries the client secret

- name: Roles it has now
  ansible.builtin.uri:
    url: "{{ dataplatform_iam_kc_api }}/users/{{ dataplatform_iam_sa_user.json.id }}/role-mappings/clients/{{ item.json[0].id }}"
    headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
  loop: "{{ dataplatform_iam_sa_role_clients.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: "{{ dataplatform_iam_kc_host }}"
  register: dataplatform_iam_sa_roles

- name: Available roles of those clients
  ansible.builtin.uri:
    url: "{{ dataplatform_iam_kc_api }}/clients/{{ item.json[0].id }}/roles"
    headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
  loop: "{{ dataplatform_iam_sa_role_clients.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: "{{ dataplatform_iam_kc_host }}"
  register: dataplatform_iam_sa_available

- name: Grant the missing roles
  ansible.builtin.uri:
    url: "{{ dataplatform_iam_kc_api }}/users/{{ dataplatform_iam_sa_user.json.id }}/role-mappings/clients/{{ item.0.json[0].id }}"
    method: POST
    headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
    body_format: json
    body: "{{ item.2.json | selectattr('name', 'in', _missing) | list }}"
    status_code: [204]
  loop: >-
    {{ dataplatform_iam_sa_role_clients.results | zip(dataplatform_iam_sa_roles.results, dataplatform_iam_sa_available.results) | list }}
  loop_control:
    label: "{{ item.0.item }}"
  vars:
    _missing: "{{ dataplatform_iam_sa.clientRoles[item.0.item] | difference(item.1.json | map(attribute='name')) }}"
  when: _missing | length > 0
  delegate_to: "{{ dataplatform_iam_kc_host }}"
  changed_when: true
