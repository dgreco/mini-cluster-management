---
# Keycloak as the identity provider of the whole platform (make dataplatform-iam),
# on the Ceph admin host:
# 1. the running realm follows gitops/manifests/governance/keycloak-realm, and
#    reads its people and groups from the directory (Samba AD) through a
#    user federation;
# 2. Ceph RGW trusts the realm (OIDC provider), and the platform's own STS
#    roles (the admin groups', Meta Catalog's provisioner's); every other role
#    comes from the grants administrators authorize in Meta Catalog;
# 3. the Iceberg catalog: the Spark jobs' login;
# 4. OpenBao accepts Keycloak logins.
# People and groups come from the directory (make dataplatform-directory): a
# new group or a changed membership needs no run of this.
- name: Keycloak realm
  ansible.builtin.include_tasks: keycloak.yml

- name: Ceph RGW trusts the realm; the platform's own roles
  ansible.builtin.include_tasks: rgw.yml

- name: The Iceberg catalog - row-level security, one role per group
  ansible.builtin.include_tasks: catalog.yml

- name: OpenBao logins through Keycloak
  ansible.builtin.include_tasks: openbao.yml
