---
# End-to-end check of the IAM model on the live platform (about 10 minutes):
# temporary users of the directory (Samba AD, where every user is made; they
# reach Keycloak through its federation) smoke-eng (the engineer group),
# smoke-ana (the analyst group), smoke-both (both), smoke-nogroup and
# smoke-adm (also the admin group: only it may authorize; site.yml names the
# groups) exercise direct
# STS, Trino and Spark in the smoke test's own tables (Meta Catalog,
# metacatalog/domains.yaml and metacatalog/tables/smoke.yaml): every
# statement in Trino must be decided by the Open Policy Agent and every file
# by Ceph through a group role, both from the grants of the tables' policies,
# and only Meta Catalog may create a schema or a table in Trino. The model is
# loaded when Meta Catalog lacks it, so a platform built from scratch needs
# no other step first; the domain and the tables are loaded and provisioned
# on every run, and smoke-adm authorizes them.
# At the end, pass or fail, its tables go out of Meta Catalog again
# (rejected, unprovisioned, deleted: no grant of the test stays in the
# record), then the users go, with their Spark jobs and tokens; iam-reconcile
# runs, and nothing of the domain smoke may be left in the record (check Z2
# deletes one table without a reject, as Meta Catalog's UI lets anyone, and
# only iam-reconcile takes its grants out).
#   make dataplatform-smoke-test
- name: Data platform smoke test
  hosts: "{{ groups['k3s_servers'][0] }}"
  gather_facts: false
  vars:
    # the site's groups (group_vars/all/site.yml)
    smoke_users:
      smoke-eng: ["{{ site_engineer_group }}"]
      smoke-ana: ["{{ site_analyst_group }}"]
      smoke-both: "{{ [site_analyst_group, site_engineer_group] | sort }}"
      smoke-nogroup: []
      # the admin group after other groups: the gate must find it among several
      smoke-adm: ["{{ site_analyst_group }}", "{{ site_engineer_group }}", "{{ site_admin_group }}"]
    # the directory checks' own (F): smoke-off is disabled in the directory
    # before it ever logs in; smoke-late joins the analyst group there after
    # its first login
    smoke_directory_users:
      smoke-off: ["{{ site_engineer_group }}"]
      smoke-late: []
    smoke_adctl: >-
      /usr/local/bin/k3s kubectl -n {{ dataplatform_directory_namespace }} exec -i {{ dataplatform_directory_pod }} -c samba -- adctl
  tasks:
    - name: OpenBao client
      ansible.builtin.include_role:
        name: dataplatform_openbao
        tasks_from: client

    - name: Keycloak bootstrap admin, client secrets, the directory's read-only account
      ansible.builtin.uri:
        url: "{{ dataplatform_openbao_addr }}/v1/secret/data/dataplatform/governance/{{ item }}"
        headers: {X-Vault-Token: "{{ dataplatform_openbao_token }}"}
      loop: [keycloak-admin, keycloak-clients, samba-ad]
      register: smoke_kc_secrets
      no_log: true

    - name: Logins
      ansible.builtin.set_fact:
        smoke_kc_admin: "{{ smoke_kc_secrets.results[0] }}"
        dataplatform_iam_kc_client_secret: "{{ smoke_kc_secrets.results[1].json.data.data.ansible | default('') }}"
        smoke_client_secret: "{{ smoke_kc_secrets.results[1].json.data.data['smoke-test'] }}"
        # the account Keycloak reads the directory as: it must not be able to write
        smoke_bind_password: "{{ smoke_kc_secrets.results[2].json.data.data['bind-password'] }}"
      no_log: true

    - name: Admin API base (inside the cluster)
      ansible.builtin.include_role:
        name: dataplatform_iam
        tasks_from: keycloak_admin_base

    - name: Admin token
      ansible.builtin.include_role:
        name: dataplatform_iam
        tasks_from: keycloak_token
      vars:
        dataplatform_iam_kc_admin: "{{ smoke_kc_admin.json.data.data }}"

    - name: Password of the temporary users
      ansible.builtin.set_fact:
        # three kinds of characters: the directory refuses less
        smoke_password: >-
          {{ lookup('ansible.builtin.password', '/dev/null', length=21, chars=['ascii_letters', 'digits'])
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars=['ascii_lowercase'])
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars=['ascii_uppercase'])
             ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars=['digits']) }}
        smoke_users_json: >-
          {%- set out = {} -%}
          {%- for u, g in smoke_users.items() -%}{%- set _ = out.update({u: {'group': g[0] if g else '', 'groups': g}}) -%}{%- endfor -%}
          {{ out }}
      no_log: true

    - name: Run the checks with temporary users
      block:
        # A user an interrupted run left behind goes first: its password is
        # that run's.
        - name: Remove what an earlier run left in the directory
          ansible.builtin.command: "{{ smoke_adctl }} user remove {{ item }}"
          loop: "{{ (smoke_users | combine(smoke_directory_users)).keys() | list }}"
          register: smoke_leftover
          changed_when: smoke_leftover.rc == 0
          failed_when: false

        - name: Create the temporary users in the directory
          ansible.builtin.command:
            cmd: >-
              {{ smoke_adctl }} user add {{ item.key }} --given-name Smoke --surname {{ item.key }}
              --mail {{ item.key }}@{{ dataplatform_domain }}
              {{ item.value | map('regex_replace', '^', '--group ') | join(' ') }}
            stdin: "{{ smoke_password }}"
          loop: "{{ smoke_users | combine(smoke_directory_users) | dict2items }}"
          loop_control:
            label: "{{ item.key }} ({{ item.value | join(', ') or 'no group' }})"
          changed_when: true
          no_log: true

        - name: The directory disables smoke-off
          ansible.builtin.command: "{{ smoke_adctl }} user disable smoke-off"
          changed_when: true

        # Keycloak now knows smoke-late, in no group; what the directory says
        # afterwards has to reach its next token
        - name: First login of smoke-late
          ansible.builtin.uri:
            url: "{{ dataplatform_iam_kc_admin_base }}/realms/{{ dataplatform_keycloak_realm }}/protocol/openid-connect/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: password
              client_id: smoke-test
              client_secret: "{{ smoke_client_secret }}"
              username: smoke-late
              password: "{{ smoke_password }}"
              scope: openid
          delegate_to: "{{ dataplatform_iam_kc_host }}"
          no_log: true

        - name: The directory puts smoke-late into {{ site_analyst_group }}
          ansible.builtin.command: "{{ smoke_adctl }} group join {{ site_analyst_group }} smoke-late"
          changed_when: true

        - name: Fresh admin token
          ansible.builtin.include_role:
            name: dataplatform_iam
            tasks_from: keycloak_token
          vars:
            dataplatform_iam_kc_admin: "{{ smoke_kc_admin.json.data.data }}"

        - name: Users of the realm
          ansible.builtin.uri:
            url: "{{ dataplatform_iam_kc_admin_base }}/admin/realms/{{ dataplatform_keycloak_realm }}/users?briefRepresentation=true&max=1000"
            headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
          delegate_to: "{{ dataplatform_iam_kc_host }}"
          register: smoke_realm_users

        # Keycloak only reads the directory: this must be refused
        - name: Keycloak tries to set the password of a user of the directory
          ansible.builtin.uri:
            url: "{{ dataplatform_iam_kc_admin_base }}/admin/realms/{{ dataplatform_keycloak_realm }}/users/{{ _id }}/reset-password"
            method: PUT
            headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
            body_format: json
            body: {type: password, value: "{{ smoke_password }}x", temporary: false}
            status_code: [204, 400, 403, 500]
          vars:
            _id: "{{ (smoke_realm_users.json | selectattr('username', 'equalto', 'smoke-late') | first).id }}"
          delegate_to: "{{ dataplatform_iam_kc_host }}"
          register: smoke_keycloak_write
          no_log: true

        # what an LDAP client outside the cluster has to trust
        - name: The directory's certificate authority
          ansible.builtin.command: >-
            /usr/local/bin/k3s kubectl -n {{ dataplatform_directory_namespace }} get secret samba-ad-tls
            -o 'jsonpath={.data.ca\.crt}'
          register: smoke_directory_ca
          changed_when: false

        # iam-sync (every 30 s) writes Trino's group file; Trino re-reads it
        # every 10 s.
        - name: Wait for iam-sync to pick the users up
          ansible.builtin.shell: |
            set -o pipefail
            k="/usr/local/bin/k3s kubectl"
            end=$((SECONDS + 300))
            until $k -n compute get configmap trino-iam -o 'jsonpath={.data.groups\.txt}' | grep -q smoke-ana \
                  && $k -n compute get rolebinding spark-submitter -o name >/dev/null 2>&1 \
                  && $k -n compute get sparkapptemplate lakehouse -o name >/dev/null 2>&1; do
              [ $SECONDS -ge $end ] && exit 1
              sleep 5
            done
            sleep 30
          args:
            executable: /bin/bash
          changed_when: false

        - name: Direct STS, Trino and Spark
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/files/smoke_test.py"]
          environment:
            KEYCLOAK_ISSUER: "{{ dataplatform_keycloak_issuer }}"
            S3_ENDPOINT: "{{ dataplatform_s3_endpoint }}"
            S3_REGION: "{{ dataplatform_s3_region }}"
            TRINO_URL: https://trino.{{ dataplatform_domain }}
            JUPYTER_URL: https://jupyter.{{ dataplatform_domain }}
            METACATALOG_URL: https://metacatalog.{{ dataplatform_domain }}
            DP_TABLES: "{{ playbook_dir }}/files/dp-tables.sh"
            SMOKE_DOMAINS_FILE: "{{ playbook_dir }}/gitops/manifests/governance/metacatalog/provisioning/domains.json"
            SMOKE_TABLES_FILE: "{{ playbook_dir }}/metacatalog/tables/smoke.yaml"
            SMOKE_MODEL_FILE: "{{ playbook_dir }}/metacatalog/table-model.yaml"
            SPARK_SUBMIT: "{{ playbook_dir }}/files/dp-spark-submit.sh"
            S3_LOGIN: "{{ playbook_dir }}/files/dp-s3-login.sh"
            S3_BUCKET: "{{ dataplatform_bucket }}"
            ROLE_ARN_PREFIX: "arn:aws:iam::{{ dataplatform_rgw_account_id }}:role/"
            GROUP_ROLE_PREFIX: "{{ dataplatform_iam_group_role_prefix }}"
            ADMIN_GROUP: "{{ site_admin_group }}"
            ENGINEER_GROUP: "{{ site_engineer_group }}"
            ANALYST_GROUP: "{{ site_analyst_group }}"
            LABEL_DOMAIN: "{{ dataplatform_domain }}"
            SMOKE_USERS: "{{ smoke_users_json | to_json }}"
            SMOKE_PASSWORD: "{{ smoke_password }}"
            SMOKE_CLIENT: smoke-test
            SMOKE_CLIENT_SECRET: "{{ smoke_client_secret }}"
            SMOKE_DISABLED_USER: smoke-off
            SMOKE_LATE_USER: smoke-late
            SMOKE_LATE_GROUP: "{{ site_analyst_group }}"
            # a user's groups stay in Keycloak's cache that long at most
            SMOKE_LATE_WAIT: "{{ dataplatform_directory_cache_lifespan | int + 90 }}"
            SMOKE_KEYCLOAK_WRITE: "{{ smoke_keycloak_write.status }}"
            # LDAP from outside the cluster, through the Gateway
            DIRECTORY_LDAPS_HOST: "{{ dataplatform_directory_external_host }}"
            DIRECTORY_DOMAIN: "{{ dataplatform_directory_domain }}"
            DIRECTORY_CA: "{{ smoke_directory_ca.stdout | b64decode }}"
            # who may change an entry there, and who may not
            DIRECTORY_PEOPLE_DN: "OU={{ dataplatform_directory_people_ou }},{{ dataplatform_directory_base_dn }}"
            DIRECTORY_BIND_USER: "{{ dataplatform_directory_bind_user }}"
            DIRECTORY_BIND_PASSWORD: "{{ smoke_bind_password }}"
            # the directory's web interface (LDAP Account Manager)
            DIRECTORY_UI_URL: "{{ dataplatform_directory_ui_url }}"
            SMOKE_LOCAL_USERS: >-
              {{ smoke_realm_users.json | rejectattr('federationLink', 'defined') | map(attribute='username') | list | to_json }}
            K8S_SERVER: "{{ (lookup('ansible.builtin.file', k3s_kubeconfig) | from_yaml).clusters[0].cluster.server }}"
            K8S_CA: "{{ (lookup('ansible.builtin.file', k3s_kubeconfig) | from_yaml).clusters[0].cluster['certificate-authority-data'] }}"
          delegate_to: localhost
          become: false
          register: smoke_result
          changed_when: false
          failed_when: false

        - name: Results
          ansible.builtin.debug:
            msg: "{{ smoke_result.stdout_lines + (smoke_result.stderr_lines | select | list) }}"

        - name: Every check passed
          ansible.builtin.assert:
            that: smoke_result.rc == 0
            fail_msg: "Some checks failed: see the FAIL lines above."
            quiet: true

      always:
        - name: Remove the temporary users from the directory
          ansible.builtin.command: "{{ smoke_adctl }} user remove {{ item }}"
          loop: "{{ (smoke_users | combine(smoke_directory_users)).keys() | list }}"
          register: smoke_removed
          changed_when: smoke_removed.rc == 0
          failed_when: false

        - name: Fresh admin token
          ansible.builtin.include_role:
            name: dataplatform_iam
            tasks_from: keycloak_token
          vars:
            dataplatform_iam_kc_admin: "{{ smoke_kc_admin.json.data.data }}"

        # Loading a user makes Keycloak ask the directory, and drop its copy
        # of one that is gone, unless it still has the user in its cache:
        # whatever the lookup still finds is deleted. That delete loads the
        # user too, on whichever Keycloak pod takes it, and when that drops
        # the copy first, the delete finds its row gone and answers 500. What
        # counts is the last task: no copy is left.
        - name: Find Keycloak's copies of the temporary users
          ansible.builtin.uri:
            url: "{{ dataplatform_iam_kc_admin_base }}/admin/realms/{{ dataplatform_keycloak_realm }}/users?username={{ item }}&exact=true"
            headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
          loop: "{{ (smoke_users | combine(smoke_directory_users)).keys() | list }}"
          delegate_to: "{{ dataplatform_iam_kc_host }}"
          register: smoke_found

        - name: Delete them
          ansible.builtin.uri:
            url: "{{ dataplatform_iam_kc_admin_base }}/admin/realms/{{ dataplatform_keycloak_realm }}/users/{{ item.json[0].id }}"
            method: DELETE
            headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
            status_code: [204, 404, 500]
          loop: "{{ smoke_found.results | selectattr('json', 'truthy') | list }}"
          loop_control:
            label: "{{ item.item }}"
          delegate_to: "{{ dataplatform_iam_kc_host }}"
          changed_when: true

        - name: Keycloak holds no copy of them any more
          ansible.builtin.uri:
            url: "{{ dataplatform_iam_kc_admin_base }}/admin/realms/{{ dataplatform_keycloak_realm }}/users?username={{ item }}&exact=true"
            headers: {Authorization: "Bearer {{ dataplatform_iam_kc_token }}"}
          loop: "{{ (smoke_users | combine(smoke_directory_users)).keys() | list }}"
          delegate_to: "{{ dataplatform_iam_kc_host }}"
          register: smoke_left
          until: smoke_left.json | length == 0
          retries: 4
          delay: 5

        # Their Spark jobs, in compute under their user label: the operator's
        # ConfigMaps, service account and role binding belong to a job and go
        # with it; the token Secrets belong to none.
        - name: Delete their Spark jobs and tokens
          ansible.builtin.shell: |
            set -o pipefail
            k="/usr/local/bin/k3s kubectl -n compute"
            $k delete sparkapplications.spark.stackable.tech --ignore-not-found --wait=true --timeout=120s \
              -l '{{ dataplatform_domain }}/user in ({{ smoke_users.keys() | join(',') }})'
            $k get secrets -o name \
              | { grep -E '^secret/spark-token-({{ smoke_users.keys() | map('regex_escape') | join('|') }})-' || true; } \
              | xargs -r $k delete --ignore-not-found
          args:
            executable: /bin/bash
          changed_when: true

        - name: Nothing of their Spark jobs is left
          ansible.builtin.shell: |
            set -o pipefail
            k="/usr/local/bin/k3s kubectl -n compute"
            {
              $k get sparkapplications.spark.stackable.tech -o name -l '{{ dataplatform_domain }}/user in ({{ smoke_users.keys() | join(',') }})'
              $k get secrets -o name | grep -E '^secret/spark-token-({{ smoke_users.keys() | map('regex_escape') | join('|') }})-' || true
            } | sed '/^$/d'
          args:
            executable: /bin/bash
          register: smoke_jobs_left
          changed_when: false
          failed_when: smoke_jobs_left.rc != 0 or smoke_jobs_left.stdout | length > 0

        # A table deleted in Meta Catalog without a reject (its UI's delete
        # calls no script) leaves its keys in the record, and its grants in
        # force, until iam-reconcile finds Meta Catalog has it no more (every
        # ten minutes); check Z2 made one. Here it runs at once, as
        # make dataplatform-grants ARGS=apply does.
        - name: Take out of the record what Meta Catalog has no more (iam-reconcile)
          ansible.builtin.command: >-
            /usr/local/bin/k3s kubectl -n governance exec deploy/metacatalog -c metacatalog --
            bash /opt/metacatalog/provisioning/reconcile.sh apply
          register: smoke_reconcile
          changed_when: "'removed ' in smoke_reconcile.stdout"

        - name: Nothing of the domain smoke is left in the record
          ansible.builtin.shell: |
            set -o pipefail
            /usr/local/bin/k3s kubectl -n governance get configmap metacatalog-grants -o 'jsonpath={.data}' \
              | { grep -oE '"(folder\.smoke\.|table\.smoke_)[^"]*"' || true; }
          args:
            executable: /bin/bash
          register: smoke_record_after
          changed_when: false
          failed_when: smoke_record_after.rc != 0 or smoke_record_after.stdout | length > 0
