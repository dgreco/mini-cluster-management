---
# Admin kubeconfig for the control node, pointing at the first server by IP
# (on macOS `.local` names go through mDNS first and every call stalls), with
# cluster/context/user named `k3s`:
# - .secrets/k3s.yaml (k3s_kubeconfig), always;
# - merged into k3s_local_kubeconfig (default ~/.kube/config) as the current
#   context. Entries of an earlier install (any cluster whose server is one of
#   the k3s servers, by IP or name, or anything named `k3s`) are replaced;
#   other clusters are kept. The previous file is backed up next to it.
#   Set k3s_local_kubeconfig to '' to skip the merge.
- name: Kubeconfig
  hosts: k3s_servers
  gather_facts: true
  gather_subset: [network]
  tasks:
    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_admin_kubeconfig
      run_once: true
      delegate_to: "{{ k3s_first_server }}"
      no_log: true

    - name: Kubeconfig for the control node
      ansible.builtin.set_fact:
        k3s_kubeconfig_new: >-
          {{ k3s_admin_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ hostvars[k3s_first_server]['ansible_facts']['default_ipv4']['address'] ~ ':6443')
             | regex_replace('(?m)(name|cluster|user|current-context): default$', '\1: k3s') }}
        # Every way an earlier kubeconfig may have addressed a server.
        k3s_server_urls: >-
          {{ (groups['k3s_servers']
              + (groups['k3s_servers'] | map('extract', hostvars, 'ansible_host') | list)
              + (groups['k3s_servers'] | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'address']) | list))
             | unique | map('regex_replace', '^(.*)$', 'https://\1:6443') | list }}
      run_once: true
      no_log: true

    - name: Save .secrets/k3s.yaml
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig_new }}"
        dest: "{{ k3s_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Merge into {{ k3s_local_kubeconfig }}
      when: k3s_local_kubeconfig | length > 0
      delegate_to: localhost
      become: false
      run_once: true
      block:
        - name: Current local kubeconfig
          ansible.builtin.stat:
            path: "{{ k3s_local_kubeconfig }}"
          register: k3s_local_stat

        - name: Directory for the local kubeconfig
          ansible.builtin.file:
            path: "{{ k3s_local_kubeconfig | dirname }}"
            state: directory
            mode: "0700"

        - name: Write the merged kubeconfig
          ansible.builtin.copy:
            content: "{{ _merged | to_nice_yaml(indent=2) }}"
            dest: "{{ k3s_local_kubeconfig }}"
            mode: "0600"
            backup: true
          vars:
            _new: "{{ k3s_kubeconfig_new | from_yaml }}"
            _old: >-
              {{ (lookup('file', k3s_local_kubeconfig) | from_yaml if k3s_local_stat.stat.exists else {}) or {} }}
            # Clusters of an earlier k3s install, and the contexts/users they used.
            _stale_clusters: >-
              {{ (_old.clusters | default([]) | selectattr('cluster.server', 'in', k3s_server_urls) | map(attribute='name') | list)
                 + ['k3s'] }}
            _stale_contexts: >-
              {{ _old.contexts | default([]) | selectattr('context.cluster', 'in', _stale_clusters) | list }}
            _stale_users: >-
              {{ (_stale_contexts | map(attribute='context.user') | list) + ['k3s'] }}
            _merged:
              apiVersion: v1
              kind: Config
              preferences: "{{ _old.preferences | default({}) }}"
              clusters: >-
                {{ (_old.clusters | default([]) | rejectattr('name', 'in', _stale_clusters) | list) + _new.clusters }}
              contexts: >-
                {{ (_old.contexts | default([]) | rejectattr('name', 'in', _stale_contexts | map(attribute='name') | list + ['k3s']) | list)
                   + _new.contexts }}
              users: >-
                {{ (_old.users | default([]) | rejectattr('name', 'in', _stale_users) | list) + _new.users }}
              current-context: k3s
          register: k3s_local_merge
          no_log: true

    - name: Usage
      ansible.builtin.debug:
        msg:
          - "kubectl uses context k3s from {{ k3s_local_kubeconfig if k3s_local_kubeconfig | length > 0 else k3s_kubeconfig | realpath }}"
          - "API https://{{ hostvars[k3s_first_server]['ansible_facts']['default_ipv4']['address'] }}:6443; standalone copy: {{ k3s_kubeconfig | realpath }}"
          - "{{ ('previous kubeconfig saved as ' ~ k3s_local_merge.backup_file) if k3s_local_merge.backup_file | default('') else '' }}"
      run_once: true
