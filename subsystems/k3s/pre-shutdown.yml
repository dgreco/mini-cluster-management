---
# Cluster hook: called by cluster/shutdown.yml before the Ceph pre-shutdown hook,
# for a whole-cluster shutdown only (single nodes are drained instead).
# Stops k3s and releases the pods' volumes while Ceph is still serving:
# k3s-killall.sh stops the service, kills the containers and unmounts the pod
# volumes; the RBD images left mapped are then unmapped.
- name: Stop k3s
  hosts: k3s
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Only for a whole-cluster shutdown
      ansible.builtin.meta: end_host
      when: not hostvars['localhost']['shutdown_whole'] | default(true)

    - name: Skip a node that is off
      ansible.builtin.include_tasks: ../../cluster/tasks/ssh-probe.yml

    - name: Is k3s-killall.sh present?
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-killall.sh
      register: k3s_killall

    - name: Stop k3s and its containers, unmount pod volumes
      ansible.builtin.command: /usr/local/bin/k3s-killall.sh
      when: k3s_killall.stat.exists
      changed_when: true

    - name: Unmap RBD images
      ansible.builtin.shell: |
        for d in /sys/bus/rbd/devices/*; do
          [ -e "$d" ] || continue
          echo "$(basename "$d")" > /sys/bus/rbd/remove && echo "unmapped rbd$(basename "$d")"
        done
      register: k3s_rbd_unmap
      changed_when: k3s_rbd_unmap.stdout | length > 0
      failed_when: false
      when: k3s_killall.stat.exists
