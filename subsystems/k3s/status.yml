---
- name: Show the k3s status
  hosts: "{{ groups['k3s_servers'][0] }}"
  gather_facts: false
  vars:
    k3s_status_flannel_columns:
      - NAME:.metadata.name
      - ADDRESS:.status.addresses[?(@.type=="InternalIP")].address
      - FLANNEL:.metadata.annotations.flannel\.alpha\.coreos\.com/public-ip
      - BACKEND:.metadata.annotations.flannel\.alpha\.coreos\.com/backend-type
  tasks:
    - name: Collect
      ansible.builtin.command: /usr/local/bin/k3s kubectl {{ item }}
      loop:
        - get nodes -o wide
        # the address flannel publishes to the other nodes must be the node's own
        - "get nodes -o 'custom-columns={{ k3s_status_flannel_columns | join(',') }}'"
        - get pods -A -o wide
        - get storageclass
        - get pv
        - get pvc -A
        - get helmcharts -A
      loop_control:
        label: "kubectl {{ item }}"
      register: k3s_status
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ ['$ kubectl ' ~ item.item] + item.stdout_lines + item.stderr_lines }}"
      loop: "{{ k3s_status.results }}"
      loop_control:
        label: "kubectl {{ item.item }}"

    - name: Access
      ansible.builtin.debug:
        msg: "export KUBECONFIG={{ k3s_kubeconfig | realpath }}  (make k3s-kubeconfig refreshes it)"
